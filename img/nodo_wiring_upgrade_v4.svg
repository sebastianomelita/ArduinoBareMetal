<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1090" width="1240" height="1090" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="1090" fill="#ffffff"/>
<text x="620" y="32" font-size="20" fill="#212121" text-anchor="middle" font-weight="bold">Upgrade multisensore — Heltec WiFi LoRa 32 V4</text>
<text x="620" y="54" font-size="13" fill="#616161" text-anchor="middle">MPL3115A2 (pressione) · CJMCU-811 / CCS811 (TVOC) · SDS011 (PM2.5 / PM10) — in aggiunta allo schema base</text>
<rect x="20" y="72" width="310" height="112" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" />
<text x="32" y="92" font-size="12" fill="#424242" text-anchor="start" font-weight="bold">Legenda linee</text>
<path d="M32 108H58" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="112" font-size="11.5" fill="#333" text-anchor="start">3,3 V sempre acceso</text>
<path d="M32 128H58" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
<text x="64" y="132" font-size="11.5" fill="#333" text-anchor="start">Vext (GPIO 36)</text>
<path d="M32 148H58" fill="none" stroke="#8e0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="152" font-size="11.5" fill="#333" text-anchor="start">Batteria VBAT</text>
<path d="M32 168H58" fill="none" stroke="#b5179e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="172" font-size="11.5" fill="#333" text-anchor="start">5 V dal boost</text>
<path d="M184 108H210" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="112" font-size="11.5" fill="#333" text-anchor="start">Massa (GND)</text>
<path d="M184 128H210" fill="none" stroke="#1976d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="132" font-size="11.5" fill="#333" text-anchor="start">I²C Wire (Vext)</text>
<path d="M184 148H210" fill="none" stroke="#00897b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="152" font-size="11.5" fill="#333" text-anchor="start">I²C Wire1 (3V3)</text>
<path d="M184 168H210" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="172" font-size="11.5" fill="#333" text-anchor="start">UART / enable</text>
<rect x="340" y="72" width="560" height="104" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" />
<text x="354" y="94" font-size="13" fill="#e65100" text-anchor="start" font-weight="bold">⚠ Due bus I²C separati</text>
<text x="354" y="114" font-size="12" fill="#5d4037" text-anchor="start">Wire (GPIO 7/6): SCD41 e MPL3115A2, alimentati da Vext → si spengono in sleep.</text>
<text x="354" y="132" font-size="12" fill="#5d4037" text-anchor="start">Wire1: CCS811, alimentato SEMPRE dal 3V3 (non va spento).</text>
<text x="354" y="150" font-size="12" fill="#5d4037" text-anchor="start">Sullo stesso bus, con Vext spenta, i pull-up del CCS811</text>
<text x="354" y="168" font-size="12" fill="#5d4037" text-anchor="start">alimenterebbero il SCD41 attraverso SDA e SCL.</text>
<rect x="470" y="200" width="375" height="620" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="2.5" />
<text x="657.5" y="228" font-size="17" fill="#263238" text-anchor="middle" font-weight="bold">Heltec WiFi LoRa 32 V4</text>
<text x="657.5" y="247" font-size="12" fill="#546e7a" text-anchor="middle" font-style="italic">ESP32-S3R2 + SX1262</text>
<circle cx="470" cy="300" r="4.5" fill="#d32f2f"/>
<text x="482" y="304" font-size="13" fill="#d32f2f" text-anchor="start">Vext 3,3 V (J2.3/4)</text>
<circle cx="470" cy="330" r="4.5" fill="#212121"/>
<text x="482" y="334" font-size="13" fill="#212121" text-anchor="start">GND (J2.1)</text>
<circle cx="470" cy="360" r="4.5" fill="#1976d2"/>
<text x="482" y="364" font-size="13" fill="#1976d2" text-anchor="start">GPIO 7 — SDA Wire (J3.18)</text>
<circle cx="470" cy="390" r="4.5" fill="#1976d2"/>
<text x="482" y="394" font-size="13" fill="#1976d2" text-anchor="start">GPIO 6 — SCL Wire (J3.17)</text>
<circle cx="470" cy="500" r="4.5" fill="#d32f2f"/>
<text x="482" y="504" font-size="13" fill="#d32f2f" text-anchor="start">3V3 (J3.2)</text>
<circle cx="470" cy="530" r="4.5" fill="#212121"/>
<text x="482" y="534" font-size="13" fill="#212121" text-anchor="start">GND (J3.1)</text>
<circle cx="470" cy="560" r="4.5" fill="#00897b"/>
<text x="482" y="564" font-size="13" fill="#00897b" text-anchor="start">GPIO 4 — SDA Wire1 (J3.15)</text>
<circle cx="470" cy="590" r="4.5" fill="#00897b"/>
<text x="482" y="594" font-size="13" fill="#00897b" text-anchor="start">GPIO 5 — SCL Wire1 (J3.16)</text>
<circle cx="845" cy="330" r="4.5" fill="#ef6c00"/>
<text x="833" y="334" font-size="13" fill="#ef6c00" text-anchor="end">(J2.13) SDS_EN — GPIO 47</text>
<circle cx="845" cy="590" r="4.5" fill="#ef6c00"/>
<text x="833" y="594" font-size="13" fill="#ef6c00" text-anchor="end">(J2.14) SDS_RX — GPIO 48</text>
<circle cx="845" cy="780" r="4.5" fill="#8e0000"/>
<text x="833" y="784" font-size="13" fill="#8e0000" text-anchor="end">BAT (SH1.25)</text>
<text x="657.5" y="660" font-size="12" fill="#455a64" text-anchor="middle">Uso dei bus:</text>
<text x="657.5" y="678" font-size="12" fill="#607d8b" text-anchor="middle">Wire: SCD41 + MPL3115A2 (su Vext)</text>
<text x="657.5" y="696" font-size="12" fill="#607d8b" text-anchor="middle">Wire1: CCS811 (sempre su 3V3)</text>
<text x="657.5" y="714" font-size="12" fill="#607d8b" text-anchor="middle">UART1: GPS · UART2: SDS011 (solo RX)</text>
<text x="657.5" y="732" font-size="12" fill="#607d8b" text-anchor="middle">Vext_Ctrl GPIO 36 · ADC_Ctrl GPIO 37</text>
<rect x="40" y="234" width="290" height="184" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="2" />
<text x="185.0" y="258" font-size="16" fill="#283593" text-anchor="middle" font-weight="bold">MPL3115A2</text>
<text x="185.0" y="276" font-size="12" fill="#555" text-anchor="middle" font-style="italic">pressione + T · I²C 0x60 · one-shot</text>
<circle cx="330" cy="300" r="4.5" fill="#d32f2f"/>
<text x="54" y="304" font-size="13" fill="#212121" text-anchor="start">VIN — da Vext</text>
<circle cx="330" cy="330" r="4.5" fill="#212121"/>
<text x="54" y="334" font-size="13" fill="#212121" text-anchor="start">GND</text>
<circle cx="330" cy="360" r="4.5" fill="#1976d2"/>
<text x="54" y="364" font-size="13" fill="#212121" text-anchor="start">SDA</text>
<circle cx="330" cy="390" r="4.5" fill="#1976d2"/>
<text x="54" y="394" font-size="13" fill="#212121" text-anchor="start">SCL</text>
<path d="M330 300H400V300H470" fill="none" stroke="#d32f2f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
<path d="M330 330H385V330H470" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 360H370V360H470" fill="none" stroke="#1976d2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 390H355V390H470" fill="none" stroke="#1976d2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="434" width="290" height="244" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="2" />
<text x="185.0" y="458" font-size="16" fill="#00695c" text-anchor="middle" font-weight="bold">CJMCU-811 (CCS811)</text>
<text x="185.0" y="476" font-size="12" fill="#555" text-anchor="middle" font-style="italic">TVOC + eCO₂ · I²C 0x5A · sempre acceso</text>
<circle cx="330" cy="500" r="4.5" fill="#d32f2f"/>
<text x="54" y="504" font-size="13" fill="#212121" text-anchor="start">VCC — 3V3 sempre acceso</text>
<circle cx="330" cy="530" r="4.5" fill="#212121"/>
<text x="54" y="534" font-size="13" fill="#212121" text-anchor="start">GND</text>
<circle cx="330" cy="560" r="4.5" fill="#00897b"/>
<text x="54" y="564" font-size="13" fill="#212121" text-anchor="start">SDA</text>
<circle cx="330" cy="590" r="4.5" fill="#00897b"/>
<text x="54" y="594" font-size="13" fill="#212121" text-anchor="start">SCL</text>
<circle cx="330" cy="620" r="4.5" fill="#212121"/>
<text x="54" y="624" font-size="13" fill="#212121" text-anchor="start">WAK — a GND (sempre sveglio)</text>
<circle cx="330" cy="650" r="4.5" fill="#212121"/>
<text x="54" y="654" font-size="13" fill="#212121" text-anchor="start">ADD — a GND (indirizzo 0x5A)</text>
<path d="M330 500H400V500H470" fill="none" stroke="#d32f2f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 530H385V530H470" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 560H370V560H470" fill="none" stroke="#00897b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 590H355V590H470" fill="none" stroke="#00897b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 620H385V530" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 650H385V530" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="385" cy="530" r="3.5" fill="#212121"/>
<text x="50" y="696" font-size="12" fill="#555" text-anchor="start">RST e INT non collegati. Pull-up su SDA/SCL: se la</text>
<text x="50" y="712" font-size="12" fill="#555" text-anchor="start">scheda non li ha, 10 kΩ verso 3V3 su ciascuna linea.</text>
<rect x="900" y="214" width="300" height="140" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
<text x="1050" y="236" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">Interruttore lato alto SDS011</text>
<text x="914" y="258" font-size="12" fill="#5d4037" text-anchor="start">P-MOSFET AO3401: source su VBAT,</text>
<text x="914" y="276" font-size="12" fill="#5d4037" text-anchor="start">drain verso IN+ del boost, 100 kΩ gate-source.</text>
<text x="914" y="294" font-size="12" fill="#5d4037" text-anchor="start">N-MOSFET 2N7002: drain sul gate del P,</text>
<text x="914" y="312" font-size="12" fill="#5d4037" text-anchor="start">gate ← SDS_EN, 100 kΩ gate-GND.</text>
<text x="914" y="330" font-size="12" fill="#5d4037" text-anchor="start">SDS_EN alto = SDS011 alimentato.</text>
<circle cx="900" cy="330" r="4.5" fill="#ef6c00"/>
<text x="908" y="324" font-size="11" fill="#212121" text-anchor="start"></text>
<path d="M845 330H900" fill="none" stroke="#ef6c00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1200" cy="250" r="4.5" fill="#8e0000"/>
<text x="1192" y="242" font-size="11" fill="#8e0000" text-anchor="end" font-weight="bold">VBAT</text>
<circle cx="1050" cy="354" r="4.5" fill="#8e0000"/>
<rect x="900" y="384" width="300" height="76" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
<text x="1050" y="408" font-size="14" fill="#6a1b9a" text-anchor="middle" font-weight="bold">Boost 5 V</text>
<text x="1050" y="426" font-size="12" fill="#555" text-anchor="middle">es. MT3608 regolato a 5,0 V o Pololu U1V11F5</text>
<text x="1050" y="444" font-size="12" fill="#555" text-anchor="middle">+ 470 µF sull'uscita, vicino al sensore</text>
<path d="M1050 354V384" fill="none" stroke="#8e0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1058" y="374" font-size="11" fill="#8e0000" text-anchor="start">IN+</text>
<rect x="900" y="524" width="300" height="154" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2" />
<text x="1050.0" y="548" font-size="16" fill="#ad1457" text-anchor="middle" font-weight="bold">Nova SDS011</text>
<text x="1050.0" y="566" font-size="12" fill="#555" text-anchor="middle" font-style="italic">PM2.5 / PM10 · UART 9600 · 5 V, ~70 mA</text>
<circle cx="900" cy="590" r="4.5" fill="#ef6c00"/>
<text x="914" y="594" font-size="13" fill="#212121" text-anchor="start">TXD → SDS_RX</text>
<circle cx="900" cy="620" r="4.5" fill="#9e9e9e"/>
<text x="914" y="624" font-size="13" fill="#212121" text-anchor="start">RXD — non collegato</text>
<circle cx="900" cy="650" r="4.5" fill="#212121"/>
<text x="914" y="654" font-size="13" fill="#212121" text-anchor="start">GND</text>
<path d="M1050 460V524" fill="none" stroke="#b5179e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1058" y="500" font-size="11" fill="#b5179e" text-anchor="start" font-weight="bold">5 V → pin 5V del SDS011</text>
<path d="M845 590H872V590H900" fill="none" stroke="#ef6c00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="900" y="712" width="300" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2" />
<text x="1050.0" y="736" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">LiPo 1S + protezione</text>
<text x="1050.0" y="754" font-size="12" fill="#555" text-anchor="middle" font-style="italic">P+ alla scheda e al ramo VBAT dell'SDS011</text>
<circle cx="900" cy="778" r="4.5" fill="#8e0000"/>
<text x="914" y="782" font-size="13" fill="#212121" text-anchor="start">P+ → BAT della scheda</text>
<path d="M845 780H872V778H900" fill="none" stroke="#8e0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1200 752H1222V250H1200" fill="none" stroke="#8e0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1214" y="480" font-size="11" fill="#8e0000" text-anchor="end" font-weight="bold">VBAT</text>
<rect x="40" y="850" width="1160" height="222" rx="10" fill="#f8f9fa" stroke="#ccc" stroke-width="1" />
<text x="60" y="878" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">Note</text>
<text x="60" y="904" font-size="13" fill="#333" text-anchor="start">• MPL3115A2: INT1 e INT2 non collegati. Il SCD41 resta sullo stesso bus Wire (0x62): nessun conflitto con lo 0x60.</text>
<text x="60" y="928" font-size="13" fill="#333" text-anchor="start">• Tutte le masse sono comuni: GND della scheda, dei sensori, del boost e il negativo della batteria (lato carico della protezione).</text>
<text x="60" y="952" font-size="13" fill="#333" text-anchor="start">• SDS011 alimentato solo durante la misura: il firmware accende SDS_EN all'inizio del ciclo e lo spegne dopo la lettura (~30 s di ventilazione).</text>
<text x="60" y="976" font-size="13" fill="#333" text-anchor="start">• Il boost prende corrente dalla batteria e non dal regolatore a 3,3 V della scheda: ~130 mA durante la ventilazione.</text>
<text x="60" y="1000" font-size="13" fill="#333" text-anchor="start">• CCS811 sempre alimentato: il firmware non lo resetta al risveglio, così non ripete i 20 minuti di riscaldamento.</text>
<text x="60" y="1024" font-size="13" fill="#333" text-anchor="start">• Sulla V4 il GPIO 7 è anche VFEM_Control (alimentazione del front-end LoRa): vedi la dispensa.</text>
<text x="60" y="1048" font-size="13" fill="#333" text-anchor="start">• Posizioni sui pettini J2 / J3 tra parentesi: in caso di dubbio vale la serigrafia della scheda.</text>
</svg>
