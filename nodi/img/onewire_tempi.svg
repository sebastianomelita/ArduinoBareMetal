<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600.0" y="32" font-size="21" fill="#212121" text-anchor="middle" font-weight="bold">Il bus 1-Wire: un filo, tempi precisi</text>
<text x="600.0" y="56" font-size="13" fill="#616161" text-anchor="middle">Linea alta = rilasciata (la tiene su il pull-up da 4,7 kΩ) · linea bassa = qualcuno la tira a massa</text>
<path d="M380 80H410" stroke="#1565c0" stroke-width="3"/><text x="416" y="84" font-size="12" fill="#333" text-anchor="start">tirata giù dall'ESP32</text>
<path d="M580 80H610" stroke="#c62828" stroke-width="3"/><text x="616" y="84" font-size="12" fill="#333" text-anchor="start">tirata giù dal DS18B20</text>
<rect x="780" y="72" width="16" height="14" fill="#fff59d" stroke="#f9a825"/><text x="802" y="84" font-size="12" fill="#333" text-anchor="start">istante in cui si legge la linea</text>
<text x="30" y="142" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">Reset e presenza</text>
<text x="30" y="162" font-size="12" fill="#555" text-anchor="start">l'ESP32 chiede "c'è qualcuno?"</text>
<text x="30" y="179" font-size="12" fill="#555" text-anchor="start">il sensore risponde</text>
<text x="30" y="196" font-size="12" fill="#555" text-anchor="start">tenendo bassa la linea</text>
<path d="M200 120H230" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M230 120V180H686.0V120" stroke="#1565c0" stroke-width="2.5" fill="none"/>
<rect x="230" y="120" width="456.0" height="60" fill="#1565c0" opacity="0.08"/>
<text x="458.0" y="198" font-size="11.5" fill="#1565c0" text-anchor="middle" font-weight="bold">480 µs: reset</text>
<path d="M686.0 120H714.5" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M714.5 120V180H828.5V120" stroke="#c62828" stroke-width="2.5" fill="none"/>
<rect x="714.5" y="120" width="114.0" height="60" fill="#c62828" opacity="0.08"/>
<text x="771.5" y="198" font-size="11.5" fill="#c62828" text-anchor="middle" font-weight="bold">presenza 60–240 µs</text>
<path d="M828.5 120H1113.5" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M1113.5 120H1143.5" stroke="#757575" stroke-width="2.5" fill="none"/>
<rect x="748.5" y="106" width="8" height="78" fill="#fff59d" stroke="#f9a825"/>
<text x="752.5" y="218" font-size="11.5" fill="#5d4037" text-anchor="middle">si legge a 70 µs dal rilascio: bassa = sensore presente</text>
<text x="30" y="302" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">Scrivere un 1</text>
<text x="30" y="322" font-size="12" fill="#555" text-anchor="start">impulso breve: la linea torna</text>
<text x="30" y="339" font-size="12" fill="#555" text-anchor="start">su quasi subito</text>
<path d="M200 280H230" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M230 280V340H266.0V280" stroke="#1565c0" stroke-width="2.5" fill="none"/>
<rect x="230" y="280" width="36.0" height="60" fill="#1565c0" opacity="0.08"/>
<text x="248.0" y="358" font-size="11.5" fill="#1565c0" text-anchor="middle" font-weight="bold">6 µs</text>
<path d="M266.0 280H650.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<text x="458.0" y="272" font-size="11.5" fill="#616161" text-anchor="middle" font-weight="bold">rilascia: 64 µs</text>
<path d="M650.0 280H680.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<text x="440.0" y="378" font-size="11.5" fill="#5d4037" text-anchor="middle">il sensore campiona la linea tra 15 e 60 µs: la trova ALTA → 1</text>
<text x="30" y="452" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">Scrivere uno 0</text>
<text x="30" y="472" font-size="12" fill="#555" text-anchor="start">impulso lungo: la linea resta</text>
<text x="30" y="489" font-size="12" fill="#555" text-anchor="start">bassa per quasi tutto lo slot</text>
<path d="M200 430H230" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M230 430V490H590.0V430" stroke="#1565c0" stroke-width="2.5" fill="none"/>
<rect x="230" y="430" width="360.0" height="60" fill="#1565c0" opacity="0.08"/>
<text x="410.0" y="508" font-size="11.5" fill="#1565c0" text-anchor="middle" font-weight="bold">60 µs</text>
<path d="M590.0 430H650.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<text x="620.0" y="422" font-size="11.5" fill="#616161" text-anchor="middle" font-weight="bold">10</text>
<path d="M650.0 430H680.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<text x="440.0" y="528" font-size="11.5" fill="#5d4037" text-anchor="middle">il sensore campiona la linea tra 15 e 60 µs: la trova BASSA → 0</text>
<text x="30" y="602" font-size="15" fill="#212121" text-anchor="start" font-weight="bold">Leggere un bit</text>
<text x="30" y="622" font-size="12" fill="#555" text-anchor="start">l'ESP32 apre lo slot, il sensore</text>
<text x="30" y="639" font-size="12" fill="#555" text-anchor="start">tiene bassa la linea se il bit è 0</text>
<path d="M200 580H230" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M230 580V640H248.0V580" stroke="#1565c0" stroke-width="2.5" fill="none"/>
<rect x="230" y="580" width="18.0" height="60" fill="#1565c0" opacity="0.08"/>
<text x="239.0" y="658" font-size="11.5" fill="#1565c0" text-anchor="middle" font-weight="bold">3</text>
<path d="M248.0 580H308.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M308.0 580H320.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<path d="M320.0 580H650.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<text x="485.0" y="572" font-size="11.5" fill="#616161" text-anchor="middle" font-weight="bold">bit = 1: nessuno tira giù</text>
<path d="M650.0 580H680.0" stroke="#757575" stroke-width="2.5" fill="none"/>
<rect x="304.0" y="566" width="8" height="78" fill="#fff59d" stroke="#f9a825"/>
<text x="440.0" y="678" font-size="11.5" fill="#5d4037" text-anchor="middle">si legge a 13 µs dall'inizio: entro 15 µs il sensore ha già deciso</text>
<path d="M248.0 640H500.0V580" stroke="#c62828" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
<text x="508.0" y="636" font-size="11.5" fill="#c62828" text-anchor="start" font-weight="bold">bit = 0: il sensore tiene bassa la linea</text>
<rect x="30" y="700" width="1140" height="46" rx="8" fill="#e3f2fd" stroke="#1e88e5"/>
<text x="46" y="720" font-size="12.5" fill="#0d47a1" text-anchor="start">Perché la sezione critica: un interrupt del WiFi o di FreeRTOS a metà slot allungherebbe l'impulso di 6 µs fino a 60 µs,</text>
<text x="46" y="738" font-size="12.5" fill="#0d47a1" text-anchor="start">e il sensore leggerebbe uno 0 al posto di un 1. Il driver blocca gli interrupt solo per la durata di ogni slot (al massimo 70 µs).</text>
</svg>
