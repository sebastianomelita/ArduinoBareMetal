<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .w{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .vp{stroke:#c1121f}.gnd{stroke:#444}.ctl{stroke:#1d70b8}.sw{stroke:#e07a00}.ld{stroke:#7b2cbf}
      .c{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round}
      .lbl{font-size:14px;fill:#222}
      .lblb{font-size:14px;fill:#222;font-weight:bold}
      .net{font-size:14px;font-weight:bold}
      .h{font-size:18px;font-weight:bold;fill:#1d3557}
      .leg{font-size:15px;fill:#222}
    </style>
    <g id="gnd"><path class="w gnd" d="M0 0V12M-12 12H12M-8 17H8M-4 22H4"/></g>
  </defs>

  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1d3557">MOSFET come interruttori: le due configurazioni di base</text>

  <rect x="20" y="58" width="560" height="430" rx="10" fill="#f7f9fc" stroke="#d5deea"/>
  <rect x="600" y="58" width="560" height="430" rx="10" fill="#fcf8f5" stroke="#eadfd5"/>
  <text x="40" y="86" class="h">1 · N-MOSFET lato basso (low-side)</text>
  <text x="620" y="86" class="h">2 · P-MOSFET lato alto (high-side) + driver N</text>

  <g transform="translate(0,90)">
    <!-- ===== Pannello 1: N-MOS low side ===== -->
    <path class="w vp" d="M300 20V50"/>
    <text x="310" y="30" class="net" fill="#c1121f">V+</text>
    <rect x="265" y="50" width="70" height="60" rx="4" fill="#efe6fa" stroke="#7b2cbf" stroke-width="2"/>
    <text x="300" y="85" text-anchor="middle" class="lblb">CARICO</text>
    <path class="w ld" d="M300 110V230"/>

    <path class="c" d="M300 230V265H290"/>
    <path class="c" d="M290 295H300V330"/>
    <path d="M290 258V272M290 273V287M290 288V302" stroke="#222" stroke-width="3.2"/>
    <path d="M278 258V302" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M300 280H290M300 280V295"/>
    <polygon points="291,280 299,275 299,285" fill="#222"/>
    <text x="308" y="252" class="lbl">D</text>
    <text x="308" y="322" class="lbl">S</text>
    <text x="268" y="250" class="lbl">G</text>
    <text x="330" y="276" class="lblb">N-MOSFET</text>
    <text x="330" y="294" class="lbl">es. AO3400A</text>
    <use href="#gnd" x="300" y="330"/>

    <text x="40" y="276" class="net" fill="#1d70b8">GPIO</text>
    <path class="w ctl" d="M90 280H140"/>
    <rect x="140" y="271" width="50" height="18" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="165" y="262" text-anchor="middle" class="lbl">R_G 100–470 Ω</text>
    <path class="w ctl" d="M190 280H278"/>
    <circle cx="230" cy="280" r="4.5" fill="#1d70b8"/>
    <path class="w ctl" d="M230 280V300"/>
    <rect x="221" y="300" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="160" y="330" class="lbl">R_PD 100k</text>
    <path class="w gnd" d="M230 350V362"/><use href="#gnd" x="230" y="362"/>

    <text x="40" y="128" class="lbl">• Acceso: GPIO alto → V_GS = 3,3 V</text>
    <text x="40" y="148" class="lbl">• Spento: GPIO basso o flottante (R_PD)</text>
    <text x="40" y="168" class="lbl">• Interrompe la MASSA del carico</text>
    <text x="40" y="188" class="lbl">• Va bene per: LED, relè, motori,</text>
    <text x="52" y="206" class="lbl">ventole, carichi senza linee di segnale</text>

    <!-- ===== Pannello 2: P-MOS high side + driver ===== -->
    <path class="w vp" d="M760 80H960"/>
    <text x="700" y="85" class="net" fill="#c1121f">V+</text>
    <circle cx="860" cy="80" r="4.5" fill="#c1121f"/>

    <path class="w vp" d="M860 80V95"/>
    <rect x="851" y="95" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="772" y="125" class="lbl">R_GS 100k</text>
    <path class="w sw" d="M860 145V230"/>
    <circle cx="860" cy="160" r="4.5" fill="#e07a00"/>
    <path class="w sw" d="M860 160H938"/>

    <!-- P-MOS -->
    <path class="c" d="M960 80V145H950"/>
    <path class="c" d="M950 175H960V215"/>
    <path d="M950 138V152M950 153V167M950 168V182" stroke="#222" stroke-width="3.2"/>
    <path d="M938 138V182" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M950 160H960V145"/>
    <polygon points="960,160 951,155 951,165" fill="#222"/>
    <text x="968" y="125" class="lbl">S</text>
    <text x="968" y="200" class="lbl">D</text>
    <text x="922" y="150" class="lbl">G</text>
    <text x="985" y="155" class="lblb">P-MOSFET</text>
    <text x="985" y="173" class="lbl">es. AO3401A</text>

    <rect x="925" y="215" width="70" height="60" rx="4" fill="#efe6fa" stroke="#7b2cbf" stroke-width="2"/>
    <text x="960" y="250" text-anchor="middle" class="lblb">CARICO</text>
    <path class="w gnd" d="M960 275V290"/><use href="#gnd" x="960" y="290"/>

    <!-- driver N -->
    <path class="c" d="M860 230V265H850"/>
    <path class="c" d="M850 295H860V330"/>
    <path d="M850 258V272M850 273V287M850 288V302" stroke="#222" stroke-width="3.2"/>
    <path d="M838 258V302" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M860 280H850M860 280V295"/>
    <polygon points="851,280 859,275 859,285" fill="#222"/>
    <text x="868" y="252" class="lbl">D</text>
    <text x="868" y="322" class="lbl">S</text>
    <text x="874" y="285" class="lblb">driver N</text>
    <text x="874" y="303" class="lbl">es. 2N7002</text>
    <use href="#gnd" x="860" y="330"/>

    <text x="620" y="276" class="net" fill="#1d70b8">GPIO</text>
    <path class="w ctl" d="M670 280H838"/>
    <circle cx="760" cy="280" r="4.5" fill="#1d70b8"/>
    <path class="w ctl" d="M760 280V300"/>
    <rect x="751" y="300" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="680" y="330" class="lbl">R_PD 100k</text>
    <path class="w gnd" d="M760 350V362"/><use href="#gnd" x="760" y="362"/>

    <text x="1010" y="230" class="lbl">• Interrompe il</text>
    <text x="1010" y="248" class="lbl">  POSITIVO</text>
    <text x="1010" y="270" class="lbl">• Il carico resta</text>
    <text x="1010" y="288" class="lbl">  riferito a GND</text>
    <text x="1010" y="310" class="lbl">• Per sensori con</text>
    <text x="1010" y="328" class="lbl">  UART / I²C / ADC</text>
  </g>

  <!-- Formule -->
  <rect x="20" y="505" width="1140" height="175" rx="10" fill="#f8f9fa" stroke="#ccc"/>
  <text x="40" y="533" class="lblb" font-size="16">Le formule da ricordare</text>
  <text x="40" y="562" class="leg">• Caduta di tensione:  ΔV = I_carico × R_DS(on)</text>
  <text x="40" y="562" class="leg">• Potenza dissipata:  P = I_carico² × R_DS(on)</text>
  <text x="40" y="588" class="leg">• Accensione piena:  |V_GS| ≥ 2–2,5 × |V_GS(th)|  e R_DS(on) letta sul datasheet alla |V_GS| che hai davvero</text>
  <text x="40" y="614" class="leg">• Margini:  V_DS(max) ≥ 2 × tensione di alimentazione,  I_D ≥ 2–3 × corrente del carico (picchi compresi)</text>
  <text x="40" y="640" class="leg">• Consumo delle resistenze di gate:  I = V / R  (100 kΩ a 4,2 V → 42 µA, solo mentre il driver è acceso)</text>
  <text x="40" y="666" class="leg">• Acceso: N con V_GS positiva (gate più alto del source),  P con V_GS negativa (gate più basso del source)</text>
</svg>
