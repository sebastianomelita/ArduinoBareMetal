<text x="500.0" y="54" font-size="13" fill="#616161" text-anchor="middle">f(UR) = 1 + (κ/ρ) · a / (1 − a),  a = UR/100,  ρ = 1,65 g/cm³  —  PM misurato = PM secco × f</text>
