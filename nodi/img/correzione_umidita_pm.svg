<text x="754" y="262" font-size="13.5" fill="#0d47a1" text-anchor="start" font-weight="bold">Esempio (κ = 0,4)</text>
<text x="754" y="280" font-size="12.5" fill="#263238" text-anchor="start">SDS011: PM2.5 = 35 µg/m³</text>
<text x="754" y="298" font-size="12.5" fill="#263238" text-anchor="start">SCD41: UR = 85 %</text>
<text x="754" y="316" font-size="12.5" fill="#263238" text-anchor="start">f = 1 + (0,4/1,65)·0,85/0,15</text>
<text x="754" y="334" font-size="12.5" fill="#263238" text-anchor="start">   = 2,37</text>
<text x="754" y="352" font-size="12.5" fill="#263238" text-anchor="start">PM2.5 secco = 35 / 2,37 ≈ 14,7</text>
<text x="754" y="370" font-size="12.5" fill="#263238" text-anchor="start"></text>
<text x="754" y="388" font-size="12.5" fill="#263238" text-anchor="start">Con la nebbia (UR &gt; 95 %)</text>
<text x="754" y="406" font-size="12.5" fill="#263238" text-anchor="start">nessuna formula basta:</text>
<text x="754" y="424" font-size="12.5" fill="#263238" text-anchor="start">il dato va scartato.</text>
<text x="500.0" y="606" font-size="12" fill="#616161" text-anchor="middle" font-style="italic">κ (kappa) = igroscopicità dell'aerosol: si tara confrontando il nodo con una centralina ARPA nei giorni umidi</text>
