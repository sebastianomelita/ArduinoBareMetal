<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .w{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .vbat{stroke:#c1121f}.adc{stroke:#d63384}.gnd{stroke:#444}.ctl{stroke:#1d70b8}.sw{stroke:#e07a00}
      .c{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round}
      .lbl{font-size:14px;fill:#222}
      .lblb{font-size:14px;fill:#222;font-weight:bold}
      .net{font-size:14px;font-weight:bold}
      .leg{font-size:15px;fill:#222}
    </style>
    <g id="gnd"><path class="w gnd" d="M0 0V12M-12 12H12M-8 17H8M-4 22H4"/></g>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1d3557">Variante: partitore di lettura batteria attivabile da GPIO</text>

  <g transform="translate(0,40)">
    <!-- VBAT rail -->
    <path class="w vbat" d="M80 80H400"/>
    <text x="80" y="70" class="net" fill="#c1121f">VBAT (OUT+ del TP4056)</text>
    <circle cx="300" cy="80" r="4.5" fill="#c1121f"/>

    <!-- R4 pull-up gate Q2 -->
    <path class="w vbat" d="M300 80V95"/>
    <rect x="291" y="95" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="230" y="125" class="lbl">R4 100k</text>
    <path class="w sw" d="M300 145V230"/>
    <circle cx="300" cy="160" r="4.5" fill="#e07a00"/>
    <path class="w sw" d="M300 160H378"/>

    <!-- Q2 P-MOSFET (high side), source in alto -->
    <path class="c" d="M400 80V145H390"/>
    <path class="c" d="M390 175H400V215"/>
    <path d="M390 138V152M390 153V167M390 168V182" stroke="#222" stroke-width="3.2"/>
    <path d="M378 138V182" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M390 160H400V145"/>
    <polygon points="400,160 391,155 391,165" fill="#222"/>
    <text x="408" y="125" class="lbl">S</text>
    <text x="408" y="200" class="lbl">D</text>
    <text x="360" y="152" class="lbl">G</text>
    <text x="420" y="160" class="lblb">Q2 AO3401A</text>
    <text x="420" y="177" class="lbl">P-MOSFET (interruttore lato batteria)</text>

    <!-- Q3 N-MOSFET -->
    <path class="c" d="M300 230V265H290"/>
    <path class="c" d="M290 295H300V330"/>
    <path d="M290 258V272M290 273V287M290 288V302" stroke="#222" stroke-width="3.2"/>
    <path d="M278 258V302" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M300 280H290"/>
    <path class="c" d="M300 280V295"/>
    <polygon points="291,280 299,275 299,285" fill="#222"/>
    <text x="308" y="252" class="lbl">D</text>
    <text x="308" y="322" class="lbl">S</text>
    <text x="264" y="272" class="lbl">G</text>
    <text x="320" y="283" class="lblb">Q3 2N7002</text>
    <text x="320" y="300" class="lbl">(o BSS138) N-MOSFET</text>
    <use href="#gnd" x="300" y="330"/>

    <!-- Comando da GPIO25 -->
    <path class="w ctl" d="M130 280H278"/>
    <circle cx="200" cy="280" r="4.5" fill="#1d70b8"/>
    <text x="40" y="276" class="net" fill="#1d70b8">GPIO25</text>
    <text x="40" y="294" class="lbl">(ESP32)</text>
    <path class="w ctl" d="M200 280V300"/>
    <rect x="191" y="300" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="130" y="330" class="lbl">R5 100k</text>
    <path class="w gnd" d="M200 350V362"/><use href="#gnd" x="200" y="362"/>

    <!-- Partitore -->
    <path class="w vbat" d="M400 215V235" stroke-dasharray="0"/>
    <rect x="391" y="235" width="18" height="55" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="418" y="268" class="lbl">R1 100k</text>
    <path class="w adc" d="M400 290V350"/>
    <circle cx="400" cy="330" r="4.5" fill="#d63384"/>
    <rect x="391" y="350" width="18" height="55" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="418" y="383" class="lbl">R2 100k</text>
    <path class="w gnd" d="M400 405V418"/><use href="#gnd" x="400" y="418"/>

    <path class="w adc" d="M400 330H640"/>
    <text x="650" y="335" class="net" fill="#d63384">GPIO33 (ESP32)</text>

    <!-- C5 -->
    <circle cx="520" cy="330" r="4.5" fill="#d63384"/>
    <path class="w adc" d="M520 330V362"/>
    <path class="c" d="M508 362H532M508 370H532"/>
    <path class="w gnd" d="M520 370V382"/><use href="#gnd" x="520" y="382"/>
    <text x="540" y="372" class="lbl">C5 100nF</text>

    <!-- Legenda -->
    <rect x="40" y="460" width="880" height="190" rx="8" fill="#f8f9fa" stroke="#ccc"/>
    <text x="60" y="488" class="lblb" font-size="16">Come funziona</text>
    <text x="60" y="516" class="leg">• GPIO25 = LOW (o ESP32 in deep sleep, pin flottante → R5 lo tiene basso): Q3 spento,</text>
    <text x="74" y="536" class="leg">R4 tiene il gate di Q2 a VBAT → Q2 spento. Il partitore è scollegato: consumo ≈ 0.</text>
    <text x="60" y="562" class="leg">• GPIO25 = HIGH: Q3 si accende e porta a GND il gate di Q2 → Q2 acceso, il partitore è alimentato</text>
    <text x="74" y="582" class="leg">e GPIO33 legge VBAT / 2. Attendi ~30 ms (carica di C5) prima di leggere.</text>
    <text x="60" y="608" class="leg">• L'interruttore è sul lato batteria: da spento, R2 tiene GPIO33 a 0 V. Interrompere il lato massa</text>
    <text x="74" y="628" class="leg">porterebbe invece fino a 4,2 V su GPIO33 attraverso R1: da evitare.</text>
  </g>
</svg>
