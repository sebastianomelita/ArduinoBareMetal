<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .vin{stroke:#e07a00}.v5{stroke:#b5179e}.gnd{stroke:#444}.bat{stroke:#c1121f}.usb{stroke:#1d70b8}.int{stroke:#dfe7f2}
      .c{fill:none;stroke:#222;stroke-width:2.4;stroke-linecap:round}
      .t{font-size:14px;fill:#222}
      .tb{font-size:14px;fill:#222;font-weight:bold}
      .s{font-size:12.5px;fill:#444}
      .wt{font-size:14px;fill:#fff}
      .wtb{font-size:16px;fill:#fff;font-weight:bold}
      .ws{font-size:12.5px;fill:#dfe7f2}
      .ok{font-size:13.5px;fill:#1b7a3a;font-weight:bold}
      .leg{font-size:14.5px;fill:#222}
    </style>
    <g id="gnd"><path class="w gnd" d="M0 0V10M-11 10H11M-7 15H7M-3 20H3"/></g>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="40" y="42" font-size="23" font-weight="bold" fill="#1d3557">Opzione A con modulo buck: pannello da 9–12 V ridotto a 5 V prima del pin 5V</text>

  <!-- ===== pannello ===== -->
  <rect x="40" y="100" width="130" height="64" rx="6" fill="#e8f0fb" stroke="#1d3557" stroke-width="2"/>
  <text x="105" y="126" text-anchor="middle" class="tb">Pannello</text>
  <text x="105" y="148" text-anchor="middle" class="s">9–12 V nominali</text>
  <path class="w vin" d="M170 120H240"/>

  <!-- ===== buck ===== -->
  <rect x="240" y="90" width="180" height="110" rx="8" fill="#5a189a" stroke="#3c096c" stroke-width="2"/>
  <text x="330" y="114" text-anchor="middle" class="wtb">Buck 5 V</text>
  <text x="248" y="124" class="wt" font-size="12.5">IN+</text>
  <text x="412" y="124" class="wt" font-size="12.5" text-anchor="end">OUT+</text>
  <text x="330" y="146" text-anchor="middle" class="ws">es. MP1584 regolabile</text>
  <text x="330" y="164" text-anchor="middle" class="ws">uscita regolata a 5,4 V</text>
  <text x="248" y="190" class="wt" font-size="12.5">IN–</text>
  <text x="412" y="190" class="wt" font-size="12.5" text-anchor="end">OUT–</text>
  <path class="w v5" d="M420 120H470"/>
  <text x="440" y="110" class="tb" fill="#b5179e">5,4 V</text>

  <!-- ===== D1 ===== -->
  <polygon points="470,108 470,132 496,120" fill="#222"/>
  <path class="c" d="M496 108V132"/>
  <text x="483" y="152" text-anchor="middle" class="tb">D1</text>
  <text x="483" y="168" text-anchor="middle" class="s">SS34</text>
  <path class="w v5" d="M496 120H560"/>
  <circle cx="560" cy="120" r="5" fill="#b5179e"/>

  <!-- ===== USB esterno + D2 ===== -->
  <rect x="40" y="250" width="130" height="64" rx="6" fill="#f1f1f1" stroke="#333" stroke-width="2"/>
  <text x="105" y="276" text-anchor="middle" class="tb">USB esterno</text>
  <text x="105" y="298" text-anchor="middle" class="s">5 V (cavo tagliato)</text>
  <path class="w vin" d="M170 270H470"/>
  <polygon points="470,258 470,282 496,270" fill="#222"/>
  <path class="c" d="M496 258V282"/>
  <text x="483" y="248" text-anchor="middle" class="tb">D2</text>
  <path class="w vin" d="M496 270H560V120"/>

  <!-- ===== interruttore PROG ===== -->
  <path class="w v5" d="M560 120H592"/>
  <rect x="574" y="76" width="94" height="68" rx="10" fill="#e3f4e8" stroke="#1b7a3a" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="596" cy="120" r="4.5" fill="#fff" stroke="#222" stroke-width="2.4"/>
  <circle cx="646" cy="120" r="4.5" fill="#fff" stroke="#222" stroke-width="2.4"/>
  <path d="M600 118L640 96" stroke="#222" stroke-width="2.8" stroke-linecap="round"/>
  <path class="w v5" d="M650 120H720"/>
  <text x="621" y="166" text-anchor="middle" class="ok">SW_PROG</text>
  <text x="621" y="182" text-anchor="middle" class="s">aperto mentre</text>
  <text x="621" y="197" text-anchor="middle" class="s">programmi</text>

  <!-- ===== Heltec ===== -->
  <rect x="720" y="70" width="380" height="390" rx="12" fill="#1d4e89" stroke="#0b2545" stroke-width="2"/>
  <text x="910" y="440" text-anchor="middle" class="wtb">Heltec Kit 32 V3 / Stick Lite V3</text>
  <text x="728" y="112" class="wt">5V</text>
  <text x="728" y="314" class="wt">BAT</text>
  <text x="728" y="400" class="wt">GND</text>

  <!-- rete interna VDD_5V -->
  <path class="w int" d="M720 120H960" stroke-width="2.5"/>
  <text x="790" y="110" class="ws" font-weight="bold">VDD_5V</text>
  <rect x="960" y="111" width="44" height="18" rx="3" fill="#2c6bb3" stroke="#dfe7f2" stroke-width="2"/>
  <text x="982" y="104" text-anchor="middle" class="ws">F1</text>
  <text x="982" y="148" text-anchor="middle" class="ws">fusibile</text>
  <path class="w int" d="M1004 120H1100" stroke-width="2.5"/>
  <text x="1052" y="110" text-anchor="middle" class="ws" font-weight="bold">VUSB</text>
  <rect x="1100" y="106" width="18" height="28" rx="4" fill="#9aa5b1" stroke="#555" stroke-width="1.5"/>
  <text x="1060" y="148" class="ws" text-anchor="middle">USB-C</text>

  <!-- caricatore e regolatore -->
  <circle cx="850" cy="120" r="4" fill="#dfe7f2"/>
  <path class="w int" d="M850 120V200" stroke-width="2.5"/>
  <rect x="760" y="200" width="240" height="66" rx="6" fill="#2c6bb3"/>
  <text x="880" y="224" text-anchor="middle" class="wt">caricatore + load sharing</text>
  <text x="880" y="244" text-anchor="middle" class="wt">+ regolatore 3,3 V</text>
  <text x="880" y="259" text-anchor="middle" class="ws">(TP4054 o LGS4056, Q2, D2 interni)</text>
  <path class="w int" d="M850 266V325H720" stroke-width="2.5"/>

  <!-- riquadro esplicativo -->
  <rect x="872" y="290" width="216" height="84" rx="6" fill="#fff8e1" stroke="#e0a800" stroke-width="1.5"/>
  <text x="980" y="312" text-anchor="middle" class="t" font-weight="bold">pin 5V = VBUS dell'USB-C</text>
  <text x="980" y="331" text-anchor="middle" class="s">stesso nodo VDD_5V,</text>
  <text x="980" y="347" text-anchor="middle" class="s">separati solo dal fusibile F1:</text>
  <text x="980" y="363" text-anchor="middle" class="s">nessun diodo in mezzo</text>

  <!-- PC -->
  <path class="w usb" d="M1118 120H1180"/>
  <rect x="1180" y="92" width="120" height="56" rx="6" fill="#eef4fb" stroke="#1d70b8" stroke-width="2"/>
  <text x="1240" y="116" text-anchor="middle" class="tb">PC</text>
  <text x="1240" y="136" text-anchor="middle" class="s">programmazione</text>

  <!-- batteria -->
  <rect x="580" y="300" width="100" height="52" rx="8" fill="#fff3d6" stroke="#333" stroke-width="2"/>
  <text x="630" y="322" text-anchor="middle" class="tb">LiPo</text>
  <text x="630" y="340" text-anchor="middle" class="s">con PCM</text>
  <path class="w bat" d="M680 325H720"/>
  <text x="630" y="370" text-anchor="middle" class="s">connettore SH1.25</text>

  <!-- masse -->
  <path class="w gnd" d="M170 150H200V395"/>
  <path class="w gnd" d="M170 300H200"/>
  <circle cx="200" cy="300" r="4.5" fill="#444"/>
  <path class="w gnd" d="M240 185H215V395"/>
  <path class="w gnd" d="M420 185H440V395"/>
  <path class="w gnd" d="M200 395H720"/>
  <circle cx="215" cy="395" r="4.5" fill="#444"/>
  <circle cx="440" cy="395" r="4.5" fill="#444"/>
  <use href="#gnd" x="320" y="395"/>
  <text x="560" y="387" text-anchor="middle" class="s">massa comune</text>

  <!-- ===== legenda ===== -->
  <rect x="30" y="490" width="1340" height="250" rx="10" fill="#f8f9fa" stroke="#ccc"/>
  <text x="50" y="520" class="tb" font-size="15">Come funziona</text>
  <text x="50" y="548" class="leg">• Il buck riduce i 9–12 V del pannello a 5,4 V. Dopo D1 al pin 5V arrivano circa 5,1 V,</text>
  <text x="64" y="570" class="leg">sotto il massimo di 6 V anche a vuoto e sopra i circa 4,5 V che servono al caricatore.</text>
  <text x="50" y="598" class="leg">• D1 sta <tspan font-weight="bold">dopo</tspan> il buck: impedisce che l'USB esterno o l'USB-C</text>
  <text x="64" y="620" class="leg">spingano tensione all'indietro nell'uscita del modulo.</text>
  <text x="50" y="648" class="leg">• Di notte il buck è spento come il pannello: dalla batteria non consuma nulla.</text>

  <line x1="700" y1="505" x2="700" y2="725" stroke="#ddd" stroke-width="1.5"/>
  <text x="730" y="520" class="tb" font-size="15">Da ricordare</text>
  <text x="730" y="548" class="leg">• Regola il trimmer a 5,4 V con il tester <tspan font-weight="bold">prima</tspan> di collegare la scheda.</text>
  <text x="730" y="576" class="leg">• Pannello da <tspan font-weight="bold">9–12 V</tspan>: con uno da 6 V il buck non ha margine</text>
  <text x="744" y="598" class="leg">e l'uscita cala appena il sole si abbassa.</text>
  <text x="730" y="626" class="leg">• Il pin 5V e l'USB-C sono lo stesso nodo: mentre programmi</text>
  <text x="744" y="648" class="leg">apri SW_PROG, altrimenti il buck alimenta anche la porta del PC.</text>
  <text x="730" y="676" class="leg">• Massima tensione d'ingresso del modulo ≥ V<tspan font-size="11" dy="4">OC</tspan><tspan dy="-4"> del pannello × 1,2</tspan></text>
  <text x="744" y="698" class="leg">(es. MP1584: fino a 28 V circa).</text>
</svg>
