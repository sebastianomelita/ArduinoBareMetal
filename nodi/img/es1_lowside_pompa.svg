<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .w{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .v12{stroke:#c1121f}.gnd{stroke:#444}.ctl{stroke:#1d70b8}.ld{stroke:#7b2cbf}
      .c{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round}
      .lbl{font-size:14px;fill:#222}
      .lblb{font-size:14px;fill:#222;font-weight:bold}
      .net{font-size:14px;font-weight:bold}
      .leg{font-size:15px;fill:#222}
    </style>
    <g id="gnd"><path class="w gnd" d="M0 0V12M-12 12H12M-8 17H8M-4 22H4"/></g>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1d3557">Esercizio 1 · N-MOSFET lato basso: pompa 12 V</text>

  <!-- Alimentatore 12 V -->
  <rect x="40" y="70" width="170" height="70" rx="6" fill="#f1f1f1" stroke="#333" stroke-width="2"/>
  <text x="125" y="100" text-anchor="middle" class="lblb">Alimentatore 12 V</text>
  <text x="125" y="120" text-anchor="middle" class="lbl">≥ 3 A</text>
  <text x="200" y="96" class="lblb" text-anchor="end">+</text>
  <text x="200" y="134" class="lblb" text-anchor="end">–</text>

  <!-- rail +12 V -->
  <path class="w v12" d="M210 90H700"/>
  <text x="250" y="80" class="net" fill="#c1121f">+12 V</text>
  <circle cx="560" cy="90" r="4.5" fill="#c1121f"/>

  <!-- Pompa -->
  <path class="w v12" d="M560 90V145"/>
  <circle cx="560" cy="175" r="30" fill="#efe6fa" stroke="#7b2cbf" stroke-width="2.5"/>
  <text x="560" y="182" text-anchor="middle" font-size="20" font-weight="bold" fill="#7b2cbf">M</text>
  <text x="515" y="165" class="lblb" text-anchor="end">Pompa 12 V</text>
  <text x="515" y="184" class="lbl" text-anchor="end">1,2 A (spunto 3 A)</text>
  <path class="w ld" d="M560 205V270"/>
  <circle cx="560" cy="240" r="4.5" fill="#7b2cbf"/>

  <!-- Diodo di ricircolo (catodo verso +12 V) -->
  <path class="w v12" d="M700 90V150"/>
  <path class="c" d="M686 150H714"/>
  <polygon points="686,180 714,180 700,152" fill="#222"/>
  <path class="w ld" d="M700 180V240H560"/>
  <text x="724" y="160" class="lblb">D1 SS34</text>
  <text x="724" y="178" class="lbl">ricircolo</text>
  <text x="724" y="196" class="lbl">(catodo su +12 V)</text>

  <!-- N-MOSFET -->
  <path class="c" d="M560 270V285H550"/>
  <path class="c" d="M550 315H560V370"/>
  <path d="M550 278V292M550 293V307M550 308V322" stroke="#222" stroke-width="3.2"/>
  <path d="M538 278V322" stroke="#222" stroke-width="3.2"/>
  <path class="c" d="M560 300H550M560 300V315"/>
  <polygon points="551,300 559,295 559,305" fill="#222"/>
  <text x="568" y="280" class="lbl">D</text>
  <text x="568" y="352" class="lbl">S</text>
  <text x="526" y="274" class="lbl">G</text>
  <text x="590" y="296" class="lblb">Q1 AO3400A</text>
  <text x="590" y="314" class="lbl">N-MOSFET logic level</text>

  <!-- ESP32 e comando -->
  <rect x="40" y="250" width="130" height="130" rx="8" fill="#222" stroke="#000" stroke-width="2"/>
  <text x="105" y="290" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">ESP32</text>
  <text x="160" y="305" fill="#fff" font-size="14" text-anchor="end">GPIO</text>
  <text x="160" y="365" fill="#fff" font-size="14" text-anchor="end">GND</text>
  <path class="w ctl" d="M170 300H300"/>
  <rect x="300" y="291" width="50" height="18" fill="#fff" stroke="#222" stroke-width="2.2"/>
  <text x="325" y="282" text-anchor="middle" class="lbl">R_G 220 Ω</text>
  <path class="w ctl" d="M350 300H538"/>
  <circle cx="440" cy="300" r="4.5" fill="#1d70b8"/>
  <path class="w ctl" d="M440 300V320"/>
  <rect x="431" y="320" width="18" height="40" fill="#fff" stroke="#222" stroke-width="2.2"/>
  <text x="372" y="345" class="lbl">R_PD 100k</text>

  <!-- Masse verso il punto a stella -->
  <path class="w gnd" d="M560 370V430"/>
  <path class="w gnd" d="M440 360V430H556"/>
  <path class="w gnd" d="M170 360H190V430H436"/>
  <path class="w gnd" d="M210 130H230V425H556"/>
  <circle cx="560" cy="430" r="6" fill="#444"/>
  <use href="#gnd" x="560" y="436"/>
  <text x="580" y="436" class="lblb">massa a stella</text>
  <text x="580" y="454" class="lbl">(vicino al source di Q1)</text>

  <!-- Legenda -->
  <rect x="40" y="490" width="820" height="130" rx="8" fill="#f8f9fa" stroke="#ccc"/>
  <text x="60" y="516" class="lblb" font-size="16">Note</text>
  <text x="60" y="542" class="leg">• GPIO alto → V_GS = 3,3 V → Q1 acceso. GPIO basso o flottante (boot) → R_PD tiene Q1 spento.</text>
  <text x="60" y="566" class="leg">• D1 assorbe la sovratensione del motore allo spegnimento: senza, V_DS supererebbe i 30 V di Q1.</text>
  <text x="60" y="590" class="leg">• La corrente della pompa (fino a 3 A) torna all'alimentatore senza passare per i fili di massa dell'ESP32:</text>
  <text x="74" y="608" class="leg">tutti i ritorni si uniscono in un solo punto.</text>
</svg>
