<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .w{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .vbat{stroke:#c1121f}.vl{stroke:#7b2cbf}.gnd{stroke:#444}.ctl{stroke:#1d70b8}.sw{stroke:#e07a00}.uart{stroke:#2a9d8f}
      .c{fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round}
      .lbl{font-size:14px;fill:#222}
      .lblb{font-size:14px;fill:#222;font-weight:bold}
      .net{font-size:14px;font-weight:bold}
      .wt{fill:#fff;font-size:14px}
      .wtb{fill:#fff;font-size:17px;font-weight:bold}
      .leg{font-size:15px;fill:#222}
    </style>
    <g id="gnd"><path class="w gnd" d="M0 0V12M-12 12H12M-8 17H8M-4 22H4"/></g>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1d3557">Esercizio 2 · P-MOSFET lato alto con soft-start: modulo GSM SIM800L</text>

  <g transform="translate(0,40)">
    <!-- VBAT -->
    <path class="w vbat" d="M60 80H400"/>
    <text x="60" y="70" class="net" fill="#c1121f">VBAT 3,6–4,2 V (LiPo)</text>
    <circle cx="300" cy="80" r="4.5" fill="#c1121f"/>

    <!-- R_GS, R_S -->
    <path class="w vbat" d="M300 80V95"/>
    <rect x="291" y="95" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="214" y="125" class="lbl">R_GS 100k</text>
    <path class="w sw" d="M300 145V178"/>
    <rect x="291" y="178" width="18" height="40" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="222" y="203" class="lbl">R_S 10k</text>
    <path class="w sw" d="M300 218V230"/>
    <circle cx="300" cy="160" r="4.5" fill="#e07a00"/>
    <path class="w sw" d="M300 160H378"/>

    <!-- C_GD -->
    <circle cx="340" cy="160" r="4.5" fill="#e07a00"/>
    <path class="w sw" d="M340 160V192"/>
    <path class="c" d="M328 192H352M328 200H352"/>
    <path class="w vl" d="M340 200V222H400"/>
    <circle cx="400" cy="222" r="4.5" fill="#7b2cbf"/>
    <text x="336" y="268" class="lbl">C_GD 1 µF</text>

    <!-- Q1 P-MOSFET -->
    <path class="c" d="M400 80V145H390"/>
    <path class="c" d="M390 175H400V240"/>
    <path d="M390 138V152M390 153V167M390 168V182" stroke="#222" stroke-width="3.2"/>
    <path d="M378 138V182" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M390 160H400V145"/>
    <polygon points="400,160 391,155 391,165" fill="#222"/>
    <text x="408" y="125" class="lbl">S</text>
    <text x="408" y="200" class="lbl">D</text>
    <text x="360" y="152" class="lbl">G</text>
    <text x="420" y="150" class="lblb">Q1 P-MOSFET</text>
    <text x="420" y="168" class="lbl">R_DS(on) ≤ 40 mΩ a –2,5 V</text>

    <!-- Q2 driver N -->
    <path class="c" d="M300 230V265H290"/>
    <path class="c" d="M290 295H300V330"/>
    <path d="M290 258V272M290 273V287M290 288V302" stroke="#222" stroke-width="3.2"/>
    <path d="M278 258V302" stroke="#222" stroke-width="3.2"/>
    <path class="c" d="M300 280H290M300 280V295"/>
    <polygon points="291,280 299,275 299,285" fill="#222"/>
    <text x="308" y="252" class="lbl">D</text>
    <text x="308" y="322" class="lbl">S</text>
    <text x="264" y="272" class="lbl">G</text>
    <text x="320" y="300" class="lblb">Q2 2N7002</text>
    <use href="#gnd" x="300" y="330"/>

    <!-- GPIO -->
    <path class="w ctl" d="M120 280H278"/>
    <circle cx="200" cy="280" r="4.5" fill="#1d70b8"/>
    <text x="40" y="276" class="net" fill="#1d70b8">GPIO</text>
    <text x="40" y="294" class="lbl">(ESP32)</text>
    <path class="w ctl" d="M200 280V300"/>
    <rect x="191" y="300" width="18" height="50" fill="#fff" stroke="#222" stroke-width="2.2"/>
    <text x="122" y="330" class="lbl">R_PD 100k</text>
    <path class="w gnd" d="M200 350V362"/><use href="#gnd" x="200" y="362"/>

    <!-- Uscita commutata -->
    <path class="w vl" d="M400 240H700"/>
    <text x="440" y="232" class="net" fill="#7b2cbf">VBAT commutata</text>

    <!-- C_L -->
    <circle cx="610" cy="240" r="4.5" fill="#7b2cbf"/>
    <path class="w vl" d="M610 240V272"/>
    <path class="c" d="M598 272H622"/>
    <path class="c" d="M598 284Q610 276 622 284"/>
    <text x="589" y="270" class="lblb">+</text>
    <path class="w gnd" d="M610 280V292"/><use href="#gnd" x="610" y="292"/>
    <text x="630" y="290" class="lbl">C_L 1000 µF</text>
    <text x="630" y="306" class="lbl">low ESR</text>

    <!-- SIM800L -->
    <rect x="700" y="180" width="200" height="260" rx="8" fill="#2b2d42" stroke="#000" stroke-width="2"/>
    <text x="800" y="215" text-anchor="middle" class="wtb">SIM800L</text>
    <text x="800" y="235" text-anchor="middle" class="wt">picchi 2 A in TX</text>
    <text x="708" y="262" class="wt">VBAT</text>
    <text x="708" y="345" class="wt">GND</text>
    <text x="708" y="385" class="wt">TXD</text>
    <text x="708" y="425" class="wt">RXD</text>
    <path class="w vl" d="M700 240V257"/>
    <path class="w gnd" d="M700 340H680"/><use href="#gnd" x="680" y="340"/>

    <!-- UART -->
    <path class="w uart" d="M700 380H500"/>
    <polygon points="500,380 512,374 512,386" fill="#2a9d8f"/>
    <text x="360" y="385" class="net" fill="#2a9d8f">RX dell'ESP32</text>
    <path class="w uart" d="M500 420H688"/>
    <polygon points="700,420 688,414 688,426" fill="#2a9d8f"/>
    <text x="360" y="425" class="net" fill="#2a9d8f">TX dell'ESP32</text>

    <!-- Legenda -->
    <rect x="40" y="480" width="920" height="170" rx="8" fill="#f8f9fa" stroke="#ccc"/>
    <text x="60" y="506" class="lblb" font-size="16">Note</text>
    <text x="60" y="532" class="leg">• GPIO alto → Q2 acceso → gate di Q1 verso GND attraverso R_S → Q1 acceso. GPIO basso → R_GS spegne Q1.</text>
    <text x="60" y="556" class="leg">• |V_GS| minima = 3,6 V × R_GS / (R_GS + R_S) = 3,27 V: abbastanza per la R_DS(on) garantita a –2,5 V.</text>
    <text x="60" y="580" class="leg">• R_S + C_GD: la tensione sul modulo sale in ~16 ms, inrush su C_L ≈ 0,26 A. Spegnimento lento (~0,3 s):</text>
    <text x="74" y="600" class="leg">prima di togliere l'alimentazione spegni il modulo con il comando AT e metti il TX dell'ESP32 in alta impedenza.</text>
    <text x="60" y="624" class="leg">• Fili corti e grossi tra batteria, Q1 e modulo: il budget di caduta totale è 0,2 V con 2 A.</text>
  </g>
</svg>
