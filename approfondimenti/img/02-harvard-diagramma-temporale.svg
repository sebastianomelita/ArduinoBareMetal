<rect width="780" height="466" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" >Con Harvard fetch e accesso ai dati avvengono nello stesso ciclo</text>
<text x="24" y="52" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="start" >ciclo CC4: la lw legge la memoria dati mentre la quarta istruzione viene prelevata</text>
<rect x="386" y="90" width="62" height="330" fill="#f1ede4"/>
<text x="231" y="82" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" >CC1</text>
