ext><text x='20' y='291' font-size='14' text-anchor='start' font-weight='bold' fill='#1a202c'>duty 75%</text><text x='132' y='261' font-size='11' text-anchor='end' font-weight='normal' fill='#718096'>5 V</text><text x='132' y='321' font-size='11' text-anchor='end' font-weight='normal' fill='#718096'>0 V</text><line x1='140' y1='317' x2='770' y2='317' stroke='#cbd5e0' stroke-width='1'/><polyline points='140.0,317.0 140.0,317.0 140.0,257.0 234.5,257.0 234.5,317.0 266.0,317.0 266.0,257.0 360.5,257.0 360.5,317.0 392.0,317.0 392.0,257.0 486.5,257.0 486.5,317.0 518.0,317.0 518.0,257.0 612.5,257.0 612.5,317.0 644.0,317.0 644.0,257.0 738.5,257.0 738.5,317.0 770.0,317.0' fill='none' stroke='#2b6cb0' stroke-width='2'/><line x1='140' y1='272.0' x2='770' y2='272.0' stroke='#c05621' stroke-width='2' stroke-dasharray='7 4'/><text x='780' y='276.0' font-size='13' text-anchor='start' font-weight='bold' fill='#c05621'>media = 3,75 V</text><rect x='60' y='350' width='200' height='62' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='160.0' y='378.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Uscita PWM</text><text x='160.0' y='396.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>onda quadra 0 / 5 V</text><line x1='262' y1='381' x2='346' y2='381' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><rect x='350' y='350' width='200' height='62' rx='8' fill='#f0fff4' stroke='#2f855a' stroke-width='1.5'/><text x='450.0' y='378.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Filtro passa basso</text><text x='450.0' y='396.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>es. circuito RC</text><line x1='552' y1='381' x2='636' y2='381' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><rect x='640' y='350' width='200' height='62' rx='8' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='740.0' y='378.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Tensione continua</text><text x='740.0' y='396.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>V = duty × 5 V</text><text x='450' y='440' font-size='13' text-anchor='middle' font-weight='bold' fill='#1a202c'>PWM + filtro passa basso = DAC (il filtro restituisce il valore medio, cioè l’area sotto l’onda)</text>
</svg>