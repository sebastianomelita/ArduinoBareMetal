<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Helvetica, Arial, sans-serif">
  <title>SolidCraft: modalità ACP e modalità MCP pura</title>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FD6"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CD9"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E08A1E"/></marker>
  </defs>
  <rect width="820" height="340" fill="#FFFFFF"/>
  <line x1="410" y1="15" x2="410" y2="325" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- ===== A: modalità ACP ===== -->
  <text x="205" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">A — Modalità ACP</text>

  <rect x="20" y="42" width="170" height="236" rx="12" fill="#FAFAFA" stroke="#999" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="105" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">SolidCraft</text>

  <rect x="35" y="72" width="140" height="62" rx="10" fill="#E8F0FE" stroke="#4A6FD6" stroke-width="2"/>
  <text x="105" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A8A">Chat</text>
  <text x="105" y="117" text-anchor="middle" font-size="11" fill="#1F3A8A">client ACP</text>

  <rect x="35" y="200" width="140" height="62" rx="10" fill="#F1F0FB" stroke="#7B6CD9" stroke-width="2"/>
  <text x="105" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B2F8F">Motore CAD</text>
  <text x="105" y="245" text-anchor="middle" font-size="11" fill="#3B2F8F">server MCP</text>

  <rect x="250" y="120" width="140" height="62" rx="10" fill="#FFF4E5" stroke="#E08A1E" stroke-width="2"/>
  <text x="320" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A4B00">Agente</text>
  <text x="320" y="165" text-anchor="middle" font-size="11" fill="#8A4B00">avviato da SolidCraft</text>

  <rect x="250" y="230" width="140" height="48" rx="10" fill="#FCE8D2" stroke="#E08A1E" stroke-width="2"/>
  <text x="320" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A4B00">Modello LLM</text>

  <line x1="178" y1="108" x2="247" y2="140" stroke="#4A6FD6" stroke-width="2.5" marker-start="url(#mb)" marker-end="url(#mb)"/>
  <text x="214" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A6FD6">ACP</text>
  <line x1="247" y1="165" x2="178" y2="220" stroke="#7B6CD9" stroke-width="2.5" marker-start="url(#mv)" marker-end="url(#mv)"/>
  <text x="222" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B6CD9">MCP</text>
  <line x1="320" y1="185" x2="320" y2="227" stroke="#E08A1E" stroke-width="2.5" marker-start="url(#mo)" marker-end="url(#mo)"/>
  <text x="328" y="210" font-size="12" font-weight="bold" fill="#E08A1E">API</text>

  <text x="205" y="306" text-anchor="middle" font-size="12" font-style="italic" fill="#444">la chat è di SolidCraft: ACP + MCP</text>

  <!-- ===== B: modalità MCP pura ===== -->
  <text x="615" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">B — Modalità MCP pura</text>

  <rect x="430" y="50" width="180" height="80" rx="10" fill="#FFF4E5" stroke="#E08A1E" stroke-width="2"/>
  <text x="520" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#8A4B00">Claude Code / Cursor</text>
  <text x="520" y="97" text-anchor="middle" font-size="11" fill="#8A4B00">chat + agente</text>
  <text x="520" y="113" text-anchor="middle" font-size="11" fill="#8A4B00">(client MCP)</text>

  <rect x="660" y="66" width="140" height="48" rx="10" fill="#FCE8D2" stroke="#E08A1E" stroke-width="2"/>
  <text x="730" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A4B00">Modello LLM</text>

  <rect x="430" y="200" width="180" height="78" rx="10" fill="#F1F0FB" stroke="#7B6CD9" stroke-width="2"/>
  <text x="520" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B2F8F">SolidCraft</text>
  <text x="520" y="244" text-anchor="middle" font-size="11" fill="#3B2F8F">solidcraft-cli mcp (server)</text>
  <text x="520" y="261" text-anchor="middle" font-size="11" fill="#3B2F8F">Remote (finestra aperta) o Headless</text>

  <rect x="650" y="205" width="155" height="66" rx="10" fill="#FFFFFF" stroke="#7B6CD9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="727" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B2F8F">Altri server MCP</text>
  <text x="727" y="250" text-anchor="middle" font-size="11" fill="#3B2F8F">GitHub, file system…</text>

  <line x1="613" y1="90" x2="657" y2="90" stroke="#E08A1E" stroke-width="2.5" marker-start="url(#mo)" marker-end="url(#mo)"/>
  <text x="635" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#E08A1E">API</text>
  <line x1="520" y1="133" x2="520" y2="197" stroke="#7B6CD9" stroke-width="2.5" marker-start="url(#mv)" marker-end="url(#mv)"/>
  <text x="528" y="170" font-size="12" font-weight="bold" fill="#7B6CD9">MCP</text>
  <line x1="590" y1="133" x2="690" y2="202" stroke="#7B6CD9" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#mv)" marker-end="url(#mv)"/>
  <text x="652" y="160" font-size="12" font-weight="bold" fill="#7B6CD9">MCP</text>

  <text x="615" y="306" text-anchor="middle" font-size="12" font-style="italic" fill="#444">la chat è dell'app dell'agente: solo MCP</text>
</svg>
