<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="Helvetica, Arial, sans-serif">
<title>SolidCraft: interazione tra chat, agente e motore CAD</title><defs>
<marker id="macp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FD6"/></marker>
<marker id="mapi" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A1E"/></marker>
<marker id="mmcp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CD9"/></marker>
<marker id="musr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
</defs>
<rect width="920" height="700" fill="#FFFFFF"/>
<rect x="365" y="172" width="540" height="325" rx="8" fill="#FFF9F0" stroke="#E0B070" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="897" y="490" text-anchor="end" font-size="11" font-style="italic" fill="#8A4B00">ciclo dell'agente: si ripete finché serve</text>
<line x1="90" y1="72" x2="90" y2="600" stroke="#BBBBBB" stroke-width="1.5"/>
<rect x="10" y="20" width="160" height="52" rx="8" fill="#F2F2F2" stroke="#888" stroke-width="2"/>
<text x="90" y="51" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Utente</text>
<line x1="275" y1="72" x2="275" y2="600" stroke="#BBBBBB" stroke-width="1.5"/>
<rect x="195" y="20" width="160" height="52" rx="8" fill="#E8F0FE" stroke="#4A6FD6" stroke-width="2"/>
<text x="275" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SolidCraft – chat</text>
<text x="275" y="60" text-anchor="middle" font-size="11" fill="#555">client ACP</text>
<line x1="460" y1="72" x2="460" y2="600" stroke="#BBBBBB" stroke-width="1.5"/>
<rect x="380" y="20" width="160" height="52" rx="8" fill="#FFF4E5" stroke="#E08A1E" stroke-width="2"/>
<text x="460" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Agente</text>
<text x="460" y="60" text-anchor="middle" font-size="11" fill="#555">es. agy_acp_server</text>
<line x1="645" y1="72" x2="645" y2="600" stroke="#BBBBBB" stroke-width="1.5"/>
<rect x="565" y="20" width="160" height="52" rx="8" fill="#FCE8D2" stroke="#E08A1E" stroke-width="2"/>
<text x="645" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Modello LLM</text>
<text x="645" y="60" text-anchor="middle" font-size="11" fill="#555">Gemini / Claude</text>
<line x1="830" y1="72" x2="830" y2="600" stroke="#BBBBBB" stroke-width="1.5"/>
<rect x="750" y="20" width="160" height="52" rx="8" fill="#F1F0FB" stroke="#7B6CD9" stroke-width="2"/>
<text x="830" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SolidCraft – motore</text>
<text x="830" y="60" text-anchor="middle" font-size="11" fill="#555">server MCP + gate</text>
<line x1="90" y1="120" x2="269" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#musr)"/>
<text x="182.5" y="113" text-anchor="middle" font-size="12" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">1. scrive il prompt («crea la base 80×60»)</text>
<line x1="275" y1="160" x2="454" y2="160" stroke="#4A6FD6" stroke-width="2" marker-end="url(#macp)"/>
<text x="367.5" y="153" text-anchor="middle" font-size="12" fill="#4A6FD6" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">2. session/prompt</text>
<line x1="460" y1="200" x2="639" y2="200" stroke="#E08A1E" stroke-width="2" marker-end="url(#mapi)"/>
<text x="552.5" y="193" text-anchor="middle" font-size="12" fill="#E08A1E" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">3. prompt + elenco tool + skill</text>
<line x1="645" y1="240" x2="466" y2="240" stroke="#E08A1E" stroke-width="2" marker-end="url(#mapi)"/>
<text x="552.5" y="233" text-anchor="middle" font-size="12" fill="#E08A1E" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">4. «chiama execute(extrude, …)»</text>
<line x1="460" y1="280" x2="824" y2="280" stroke="#7B6CD9" stroke-width="2" marker-end="url(#mmcp)"/>
<text x="645.0" y="273" text-anchor="middle" font-size="12" fill="#7B6CD9" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">5. tool call: execute</text>
<line x1="830" y1="320" x2="96" y2="320" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#musr)"/>
<text x="460.0" y="313" text-anchor="middle" font-size="12" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">6. chiede approvazione (modalità Ask)</text>
<line x1="90" y1="360" x2="824" y2="360" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#musr)"/>
<text x="460.0" y="353" text-anchor="middle" font-size="12" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">7. consente / nega</text>
<line x1="830" y1="400" x2="466" y2="400" stroke="#7B6CD9" stroke-width="2" marker-end="url(#mmcp)"/>
<text x="645.0" y="393" text-anchor="middle" font-size="12" fill="#7B6CD9" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">8. risultato (+ screenshot)</text>
<line x1="460" y1="440" x2="639" y2="440" stroke="#E08A1E" stroke-width="2" marker-end="url(#mapi)"/>
<text x="552.5" y="433" text-anchor="middle" font-size="12" fill="#E08A1E" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">9. esito del tool</text>
<line x1="645" y1="480" x2="466" y2="480" stroke="#E08A1E" stroke-width="2" marker-end="url(#mapi)"/>
<text x="552.5" y="473" text-anchor="middle" font-size="12" fill="#E08A1E" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">10. risposta finale</text>
<line x1="460" y1="520" x2="281" y2="520" stroke="#4A6FD6" stroke-width="2" marker-end="url(#macp)"/>
<text x="367.5" y="513" text-anchor="middle" font-size="12" fill="#4A6FD6" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">11. messaggi, tool_call, fine turno</text>
<line x1="275" y1="560" x2="96" y2="560" stroke="#555555" stroke-width="2" marker-end="url(#musr)"/>
<text x="182.5" y="553" text-anchor="middle" font-size="12" fill="#333" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">12. aggiorna chat e vista 3D</text>
<line x1="30" y1="640" x2="64" y2="640" stroke="#4A6FD6" stroke-width="2.5" marker-end="url(#macp)"/>
<text x="72" y="644" font-size="12" fill="#333">ACP — chat ↔ agente</text>
<line x1="200" y1="640" x2="234" y2="640" stroke="#E08A1E" stroke-width="2.5" marker-end="url(#mapi)"/>
<text x="242" y="644" font-size="12" fill="#333">API del vendor — agente ↔ modello</text>
<line x1="470" y1="640" x2="504" y2="640" stroke="#7B6CD9" stroke-width="2.5" marker-end="url(#mmcp)"/>
<text x="512" y="644" font-size="12" fill="#333">MCP — agente ↔ motore CAD</text>
<line x1="700" y1="640" x2="734" y2="640" stroke="#555555" stroke-width="2.5" marker-end="url(#musr)"/>
<text x="742" y="644" font-size="12" fill="#333">interazione con l'utente</text>
<text x="460" y="680" text-anchor="middle" font-size="11" fill="#777">Semplificato da DeepWiki, tangency-labs/solidcraft, «In-App Agent Chat and Skills»</text>
</svg>