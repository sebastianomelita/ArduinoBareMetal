<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 345' width='900' height='345' font-family='Arial, Helvetica, sans-serif'>
<title>Il modello a strati</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='345' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Il modello a strati</text><text x='450' y='50' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#718096'>ogni strato usa i servizi di quello sotto e li offre a quello sopra</text><rect x='230' y='75' width='300' height='62' rx='8' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='380.0' y='103.0' text-anchor='middle' font-size='15' font-weight='bold' fill='#1a202c'>Applicazione</text><text x='380.0' y='121.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>il programma che l’utente vuole eseguire</text><line x1='320.0' y1='165' x2='320.0' y2='141' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='440.0' y1='141' x2='440.0' y2='165' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><rect x='230' y='170' width='300' height='62' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='380.0' y='198.0' text-anchor='middle' font-size='15' font-weight='bold' fill='#1a202c'>Strati intermedi</text><text x='380.0' y='216.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>sistema operativo, macchine virtuali…</text><line x1='320.0' y1='260' x2='320.0' y2='236' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='440.0' y1='236' x2='440.0' y2='260' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><rect x='230' y='265' width='300' height='62' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='380.0' y='293.0' text-anchor='middle' font-size='15' font-weight='bold' fill='#1a202c'>Hardware</text><text x='380.0' y='311.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>CPU, memoria, periferiche</text><text x='312.0' y='165' font-size='11.5' text-anchor='end' font-weight='normal' fill='#2f855a'>offre servizi</text><text x='448.0' y='165' font-size='11.5' text-anchor='start' font-weight='normal' fill='#c53030'>usa i servizi</text><text x='312.0' y='260' font-size='11.5' text-anchor='end' font-weight='normal' fill='#2f855a'>offre servizi</text><text x='448.0' y='260' font-size='11.5' text-anchor='start' font-weight='normal' fill='#c53030'>usa i servizi</text><rect x='590' y='75' width='290' height='252' rx='10' fill='#fffaf0' stroke='#c05621' stroke-width='1.2'/><text x='735' y='100' font-size='13.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>Più strati in mezzo:</text><text x='608' y='128' font-size='12.5' text-anchor='start' font-weight='normal' fill='#2f855a'>+ applicazione più portabile</text><text x='608' y='148' font-size='12.5' text-anchor='start' font-weight='normal' fill='#2f855a'>+ più facile da scrivere</text><text x='608' y='176' font-size='12.5' text-anchor='start' font-weight='normal' fill='#c53030'>− più memoria e tempo di CPU</text><text x='608' y='196' font-size='12.5' text-anchor='start' font-weight='normal' fill='#c53030'>− sistema più complesso</text><line x1='605' y1='215' x2='865' y2='215' stroke='#e2e8f0' stroke-width='1'/><text x='735' y='240' font-size='12.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>Astrazione: ogni strato</text><text x='735' y='258' font-size='12.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>nasconde i dettagli</text><text x='735' y='276' font-size='12.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>di quello che sta sotto</text><line x1='40' y1='320' x2='40' y2='85' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='28' y='205' font-size='12' fill='#718096' text-anchor='middle' transform='rotate(-90 28 205)'>dal basso verso l’alto</text><text x='130' y='106' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>in cima, sempre</text><text x='130' y='201' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>cambia da sistema</text><text x='130' y='216' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>a sistema</text><text x='130' y='296' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>in fondo, sempre</text>
</svg>