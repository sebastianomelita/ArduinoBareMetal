<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Helvetica, Arial, sans-serif">
<title>Una richiesta attraverso gli 8 strati</title><defs>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A1E"/></marker>
</defs>
<rect width="820" height="480" fill="#FFFFFF"/>
<rect x="18.0" y="40" width="146" height="92" rx="10" fill="#E8F0FE" stroke="#4A6FD6" stroke-width="2"/>
<circle cx="34.0" cy="58" r="11" fill="#4A6FD6"/><text x="34.0" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">1</text>
<text x="50.0" y="63" font-size="13" font-weight="bold" fill="#1F3A8A">Domanda</text>
<text x="28.0" y="85" font-size="10.5" fill="#333">il cliente scrive</text>
<text x="28.0" y="100" font-size="10.5" fill="#333">nella chat</text>
<rect x="177.5" y="40" width="146" height="92" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<circle cx="193.5" cy="58" r="11" fill="#C0392B"/><text x="193.5" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">2</text>
<text x="209.5" y="63" font-size="13" font-weight="bold" fill="#8E2A1F">Guardrail in</text>
<text x="187.5" y="85" font-size="10.5" fill="#333">cerca istruzioni</text>
<text x="187.5" y="100" font-size="10.5" fill="#333">nascoste (injection)</text>
<rect x="258.7" y="110" width="58.8" height="16" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1"/>
<text x="288.1" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8E2A1F">strato 6</text>
<rect x="337.0" y="40" width="146" height="92" rx="10" fill="#F2F2F2" stroke="#555555" stroke-width="2"/>
<circle cx="353.0" cy="58" r="11" fill="#555555"/><text x="353.0" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">3</text>
<text x="369.0" y="63" font-size="13" font-weight="bold" fill="#333333">Identità</text>
<text x="347.0" y="85" font-size="10.5" fill="#333">chi chiede? con</text>
<text x="347.0" y="100" font-size="10.5" fill="#333">quali permessi?</text>
<rect x="418.2" y="110" width="58.8" height="16" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text x="447.6" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333333">strato 5</text>
<rect x="496.5" y="40" width="146" height="92" rx="10" fill="#FFF4E5" stroke="#E08A1E" stroke-width="2"/>
<circle cx="512.5" cy="58" r="11" fill="#E08A1E"/><text x="512.5" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">4</text>
<text x="528.5" y="63" font-size="13" font-weight="bold" fill="#8A4B00">Router</text>
<text x="506.5" y="85" font-size="10.5" fill="#333">risposta diretta,</text>
<text x="506.5" y="100" font-size="10.5" fill="#333">modello piccolo o grande</text>
<rect x="577.7" y="110" width="58.8" height="16" rx="8" fill="#FFFFFF" stroke="#E08A1E" stroke-width="1"/>
<text x="607.1" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8A4B00">strato 7</text>
<rect x="656.0" y="40" width="146" height="92" rx="10" fill="#E0F4F4" stroke="#0F7F81" stroke-width="2"/>
<circle cx="672.0" cy="58" r="11" fill="#0F7F81"/><text x="672.0" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">5</text>
<text x="688.0" y="63" font-size="13" font-weight="bold" fill="#0B5557">Contesto</text>
<text x="666.0" y="85" font-size="10.5" fill="#333">system prompt (cache)</text>
<text x="666.0" y="100" font-size="10.5" fill="#333">+ frammenti dal RAG</text>
<rect x="692.4" y="110" width="103.6" height="16" rx="8" fill="#FFFFFF" stroke="#0F7F81" stroke-width="1"/>
<text x="744.2" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0B5557">strati 2 · 3 · 7</text>
