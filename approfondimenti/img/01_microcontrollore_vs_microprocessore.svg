<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 415' width='900' height='415' font-family='Arial, Helvetica, sans-serif'>
<title>Microprocessore e microcontrollore</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='415' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Microprocessore e microcontrollore</text><text x='225' y='58' font-size='14' text-anchor='middle' font-weight='bold' fill='#1a202c'>Microprocessore (PC): chip separati</text><rect x='25' y='70' width='400' height='300' rx='10' fill='none' stroke='#718096' stroke-dasharray='6 4'/><text x='35' y='88' font-size='11.5' text-anchor='start' font-weight='normal' fill='#718096'>scheda madre</text><rect x='165' y='100' width='120' height='55' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='225.0' y='132.16666666666666' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>CPU</text><line x1='225' y1='155' x2='225' y2='210' stroke='#333' stroke-width='1.5'/><line x1='55' y1='210' x2='395' y2='210' stroke='#333' stroke-width='3'/><text x='400' y='214' font-size='11.5' text-anchor='start' font-weight='normal' fill='#718096'>bus</text><line x1='85' y1='210' x2='85' y2='250' stroke='#333' stroke-width='1.5'/><rect x='45' y='250' width='80' height='55' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='85.0' y='274.5' text-anchor='middle' font-size='13' font-weight='bold' fill='#1a202c'>RAM</text><text x='85.0' y='292.5' text-anchor='middle' font-size='11.5' fill='#4a5568'>dati</text><line x1='175' y1='210' x2='175' y2='250' stroke='#333' stroke-width='1.5'/><rect x='135' y='250' width='80' height='55' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='175.0' y='274.5' text-anchor='middle' font-size='13' font-weight='bold' fill='#1a202c'>Disco</text><text x='175.0' y='292.5' text-anchor='middle' font-size='11.5' fill='#4a5568'>programmi</text><line x1='265' y1='210' x2='265' y2='250' stroke='#333' stroke-width='1.5'/><rect x='225' y='250' width='80' height='55' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='265.0' y='274.5' text-anchor='middle' font-size='13' font-weight='bold' fill='#1a202c'>Video</text><text x='265.0' y='292.5' text-anchor='middle' font-size='11.5' fill='#4a5568'>schermo</text><line x1='355' y1='210' x2='355' y2='250' stroke='#333' stroke-width='1.5'/><rect x='315' y='250' width='80' height='55' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='355.0' y='274.5' text-anchor='middle' font-size='13' font-weight='bold' fill='#1a202c'>I/O</text><text x='355.0' y='292.5' text-anchor='middle' font-size='11.5' fill='#4a5568'>periferiche</text><text x='225' y='345' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>GHz · sistema operativo · multiprogrammazione</text><text x='675' y='58' font-size='14' text-anchor='middle' font-weight='bold' fill='#1a202c'>Microcontrollore: tutto in un solo chip</text><rect x='475' y='70' width='400' height='300' rx='10' fill='#fff7e6' stroke='#c05621' stroke-width='2'/><rect x='495' y='185' width='90' height='80' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='540.0' y='229.66666666666666' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>CPU</text><line x1='585' y1='225' x2='605' y2='225' stroke='#333' stroke-width='1.5'/><line x1='605' y1='92' x2='605' y2='342' stroke='#333' stroke-width='3'/><line x1='605' y1='103' x2='625' y2='103' stroke='#333' stroke-width='1.5'/><rect x='625' y='88' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='107.33333333333333' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>Flash – memoria programma</text><line x1='605' y1='139' x2='625' y2='139' stroke='#333' stroke-width='1.5'/><rect x='625' y='124' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='143.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>RAM – memoria dati</text><line x1='605' y1='175' x2='625' y2='175' stroke='#333' stroke-width='1.5'/><rect x='625' y='160' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='179.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>Porte digitali</text><line x1='605' y1='211' x2='625' y2='211' stroke='#333' stroke-width='1.5'/><rect x='625' y='196' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='215.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>ADC – ingressi analogici</text><line x1='605' y1='247' x2='625' y2='247' stroke='#333' stroke-width='1.5'/><rect x='625' y='232' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='251.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>PWM – uscite</text><line x1='605' y1='283' x2='625' y2='283' stroke='#333' stroke-width='1.5'/><rect x='625' y='268' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='287.3333333333333' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>Timer</text><line x1='605' y1='319' x2='625' y2='319' stroke='#333' stroke-width='1.5'/><rect x='625' y='304' width='235' height='30' rx='8' fill='white' stroke='#c05621' stroke-width='1.5'/><text x='742.5' y='323.3333333333333' text-anchor='middle' font-size='13' font-weight='normal' fill='#1a202c'>Watchdog timer</text><text x='675' y='395' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>MHz · senza sistema operativo · architettura Harvard</text><text x='225' y='395' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>memoria e periferiche fuori dalla CPU</text>
</svg>