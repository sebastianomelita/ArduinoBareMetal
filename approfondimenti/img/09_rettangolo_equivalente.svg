<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 545' width='900' height='545' font-family='Arial, Helvetica, sans-serif'>
<title>Il rettangolo equivalente su due treni PWM</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='545' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Duty cycle diverso → rettangolo equivalente diverso</text><text x='450' y='50' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#718096'>il rettangolo equivalente ha la stessa area degli impulsi, distribuita su tutto il tempo</text><text x='20' y='150.0' font-size='15' text-anchor='start' font-weight='bold' fill='#1a202c'>duty 25%</text><text x='102' y='89' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>5 V</text><text x='102' y='209' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>0 V</text><line x1='110' y1='205' x2='728' y2='205' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='110' y1='205' x2='110' y2='71' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='726' y='221' font-size='12' text-anchor='start' font-weight='normal' fill='#718096'>t</text><line x1='110' y1='85' x2='710' y2='85' stroke='#e2e8f0' stroke-width='1' stroke-dasharray='4 3'/><rect x='110' y='85' width='37.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='260' y='85' width='37.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='410' y='85' width='37.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='560' y='85' width='37.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><polyline points='110.0,205.0 110.0,205.0 110.0,85.0 147.5,85.0 147.5,205.0 260.0,205.0 260.0,85.0 297.5,85.0 297.5,205.0 410.0,205.0 410.0,85.0 447.5,85.0 447.5,205.0 560.0,205.0 560.0,85.0 597.5,85.0 597.5,205.0 710.0,205.0' fill='none' stroke='#2b6cb0' stroke-width='2'/><rect x='110' y='175.0' width='600' height='30.0' fill='#c05621' fill-opacity='0.22' stroke='#c05621' stroke-width='2.5' stroke-dasharray='8 4'/><line x1='110' y1='227' x2='260' y2='227' stroke='#333' stroke-width='1'/><line x1='110' y1='222' x2='110' y2='232' stroke='#333' stroke-width='1'/><line x1='260' y1='222' x2='260' y2='232' stroke='#333' stroke-width='1'/><text x='185.0' y='243' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a202c'>T</text><line x1='110' y1='227' x2='110' y2='227' stroke='#333' stroke-width='1'/><text x='750' y='113' font-size='15' text-anchor='start' font-weight='bold' fill='#c05621'>media = 1,25 V</text><text x='750' y='137' font-size='12' text-anchor='start' font-weight='normal' fill='#4a5568'>area di un periodo:</text><text x='750' y='155' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1a202c'>5 V × T/4</text><text x='750' y='179' font-size='12' text-anchor='start' font-weight='normal' fill='#4a5568'>altezza = area / T</text><text x='750' y='197' font-size='12.5' text-anchor='start' font-weight='bold' fill='#1a202c'>= 5 V × 1/4 = 1,25 V</text><text x='20' y='340.0' font-size='15' text-anchor='start' font-weight='bold' fill='#1a202c'>duty 75%</text><text x='102' y='279' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>5 V</text><text x='102' y='399' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>0 V</text><line x1='110' y1='395' x2='728' y2='395' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='110' y1='395' x2='110' y2='261' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='726' y='411' font-size='12' text-anchor='start' font-weight='normal' fill='#718096'>t</text><line x1='110' y1='275' x2='710' y2='275' stroke='#e2e8f0' stroke-width='1' stroke-dasharray='4 3'/><rect x='110' y='275' width='112.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='260' y='275' width='112.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='410' y='275' width='112.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><rect x='560' y='275' width='112.5' height='120' fill='#2b6cb0' fill-opacity='0.22'/><polyline points='110.0,395.0 110.0,395.0 110.0,275.0 222.5,275.0 222.5,395.0 260.0,395.0 260.0,275.0 372.5,275.0 372.5,395.0 410.0,395.0 410.0,275.0 522.5,275.0 522.5,395.0 560.0,395.0 560.0,275.0 672.5,275.0 672.5,395.0 710.0,395.0' fill='none' stroke='#2b6cb0' stroke-width='2'/><rect x='110' y='305.0' width='600' height='90.0' fill='#c05621' fill-opacity='0.22' stroke='#c05621' stroke-width='2.5' stroke-dasharray='8 4'/><line x1='110' y1='417' x2='260' y2='417' stroke='#333' stroke-width='1'/><line x1='110' y1='412' x2='110' y2='422' stroke='#333' stroke-width='1'/><line x1='260' y1='412' x2='260' y2='422' stroke='#333' stroke-width='1'/><text x='185.0' y='433' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a202c'>T</text><line x1='110' y1='417' x2='110' y2='417' stroke='#333' stroke-width='1'/><text x='750' y='303' font-size='15' text-anchor='start' font-weight='bold' fill='#c05621'>media = 3,75 V</text><text x='750' y='327' font-size='12' text-anchor='start' font-weight='normal' fill='#4a5568'>area di un periodo:</text><text x='750' y='345' font-size='12.5' text-anchor='start' font-weight='normal' fill='#1a202c'>5 V × 3T/4</text><text x='750' y='369' font-size='12' text-anchor='start' font-weight='normal' fill='#4a5568'>altezza = area / T</text><text x='750' y='387' font-size='12.5' text-anchor='start' font-weight='bold' fill='#1a202c'>= 5 V × 3/4 = 3,75 V</text><rect x='110' y='452' width='18' height='12' fill='#2b6cb0' fill-opacity='0.22' stroke='#2b6cb0' stroke-width='1.5'/><text x='136' y='463' font-size='12' text-anchor='start' font-weight='normal' fill='#1a202c'>impulsi PWM (area blu)</text><rect x='340' y='452' width='18' height='12' fill='#c05621' fill-opacity='0.22' stroke='#c05621' stroke-width='2' stroke-dasharray='4 2'/><text x='366' y='463' font-size='12' text-anchor='start' font-weight='normal' fill='#1a202c'>rettangolo equivalente (stessa area, altezza = valore medio)</text><rect x='20' y='480' width='860' height='50' rx='10' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='450' y='511' font-size='14.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>valore medio = area di un periodo / T = duty cycle × 5 V   →   25% dà 1,25 V, 75% dà 3,75 V</text>
</svg>