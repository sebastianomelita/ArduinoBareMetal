<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' font-family='Arial, Helvetica, sans-serif'>
<title>Il rettangolo equivalente</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='400' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Il valore medio è l’altezza del rettangolo equivalente</text><text x='450' y='50' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#718096'>esempio: duty cycle 25%, impulso da 5 V</text><text x='210' y='82' font-size='14' text-anchor='middle' font-weight='bold' fill='#1a202c'>Impulso: 5 V per 1/4 del periodo</text><line x1='80' y1='270' x2='370' y2='270' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='80' y1='270' x2='80' y2='95' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='366' y='288' font-size='12' text-anchor='start' font-weight='normal' fill='#718096'>t</text><text x='72' y='124' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>5 V</text><text x='72' y='274' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>0</text><line x1='80' y1='120' x2='340' y2='120' stroke='#e2e8f0' stroke-width='1' stroke-dasharray='4 3'/><line x1='340' y1='262' x2='340' y2='278' stroke='#333' stroke-width='1.2'/><text x='340' y='292' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a202c'>T</text><rect x='80' y='120' width='65' height='150' fill='#2b6cb0' fill-opacity='0.25' stroke='#2b6cb0' stroke-width='2'/><polyline points='80.0,270.0 80.0,120.0 145.0,120.0 145.0,270.0 340.0,270.0' fill='none' stroke='#2b6cb0' stroke-width='2'/><text x='112' y='200' font-size='12' text-anchor='middle' font-weight='bold' fill='#2b6cb0'>area</text><text x='112' y='312' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#1a202c'>area = 5 V × T/4</text><text x='450' y='190' font-size='30' text-anchor='middle' font-weight='bold' fill='#718096'>=</text><text x='450' y='215' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>stessa area</text><text x='690' y='82' font-size='14' text-anchor='middle' font-weight='bold' fill='#1a202c'>Rettangolo equivalente: largo T</text><line x1='560' y1='270' x2='850' y2='270' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='560' y1='270' x2='560' y2='95' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='846' y='288' font-size='12' text-anchor='start' font-weight='normal' fill='#718096'>t</text><text x='552' y='124' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>5 V</text><text x='552' y='274' font-size='11.5' text-anchor='end' font-weight='normal' fill='#718096'>0</text><line x1='560' y1='120' x2='820' y2='120' stroke='#e2e8f0' stroke-width='1' stroke-dasharray='4 3'/><line x1='820' y1='262' x2='820' y2='278' stroke='#333' stroke-width='1.2'/><text x='820' y='292' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a202c'>T</text><rect x='560' y='232.5' width='260' height='37.5' fill='#c05621' fill-opacity='0.25' stroke='#c05621' stroke-width='2'/><polyline points='560.0,120.0 625.0,120.0 625.0,270.0' fill='none' stroke='#2b6cb0' stroke-width='1.2' stroke-dasharray='4 3'/><text x='828' y='237' font-size='13' text-anchor='start' font-weight='bold' fill='#c05621'>1,25 V</text><text x='690' y='255' font-size='12' text-anchor='middle' font-weight='bold' fill='#c05621'>area</text><text x='690' y='312' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#1a202c'>altezza = area / T = 5 V × 1/4 = 1,25 V</text><rect x='20' y='335' width='860' height='50' rx='10' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='450' y='366' font-size='15' text-anchor='middle' font-weight='bold' fill='#1a202c'>valore medio = area di un periodo / T = duty cycle × 5 V</text>
</svg>