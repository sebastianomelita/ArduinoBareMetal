<rect width='900' height='190' fill='white'/>
<text x='450' y='28' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Dal sensore all’attuatore</text><rect x='20' y='75' width='150' height='70' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='95.0' y='107.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Mondo fisico</text><text x='95.0' y='125.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>temperatura, luce…</text><rect x='197' y='75' width='150' height='70' rx='8' fill='#f0fff4' stroke='#2f855a' stroke-width='1.5'/><text x='272.0' y='107.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Sensore</text><text x='272.0' y='125.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>INPUT</text><rect x='375' y='75' width='150' height='70' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='450.0' y='107.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Microcontrollore</text><text x='450.0' y='125.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>elabora</text><rect x='552' y='75' width='150' height='70' rx='8' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='627.0' y='107.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Attuatore</text><text x='627.0' y='125.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>OUTPUT</text><rect x='730' y='75' width='150' height='70' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='805.0' y='107.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Mondo fisico</text><text x='805.0' y='125.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>movimento, luce…</text><line x1='172' y1='110' x2='195' y2='110' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='183.5' y='62' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#4a5568'>grandezza fisica</text><line x1='349' y1='110' x2='373' y2='110' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='361.0' y='62' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#4a5568'>segnale elettrico</text><line x1='527' y1='110' x2='550' y2='110' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='538.5' y='62' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#4a5568'>segnale elettrico</text><line x1='704' y1='110' x2='728' y2='110' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='716.0' y='62' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#4a5568'>azione</text><text x='272' y='170' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#2f855a'>es. fotoresistenza, termistore, pulsante</text><text x='627' y='170' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#c05621'>es. LED, motore, relè, buzzer</text>
