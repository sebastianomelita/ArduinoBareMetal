<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title>von Neumann e Harvard a confronto</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6fd8"/></marker></defs>
<rect width="780" height="330" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="600" fill="#1f2933" text-anchor="start" >Harvard dà alla CPU due strade verso la memoria</text>
<line x1="380" y1="52" x2="380" y2="320" stroke="#d6d9de"/>
<text x="190" y="72" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >Von Neumann</text>
<rect x="110" y="90" width="160" height="48" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<text x="190" y="119" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >CPU</text>
<path d="M190 138V222" stroke="#4b5563" stroke-width="1.5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="200" y="184" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="start" >bus unico</text>
<rect x="80" y="222" width="220" height="58" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<text x="190" y="246" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >Memoria unica</text>
<text x="190" y="266" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" >istruzioni + dati</text>
<text x="190" y="306" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle" >un accesso per ciclo: istruzione OPPURE dato</text>
<text x="574" y="72" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >Harvard</text>
<rect x="494" y="90" width="160" height="48" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<text x="574" y="119" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >CPU</text>
<path d="M480 222V180H534V138" stroke="#1d6fd8" stroke-width="2.2" fill="none" marker-end="url(#b)"/>
<path d="M668 222V180H614V138" stroke="#1d6fd8" stroke-width="2.2" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="472" y="206" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="end" >bus istruzioni</text>
<text x="676" y="206" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="start" >bus dati</text>
<rect x="396" y="222" width="168" height="58" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<text x="480" y="246" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >Memoria istruzioni</text>
<text x="480" y="266" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" >codice del programma</text>
<rect x="584" y="222" width="168" height="58" rx="8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
<text x="668" y="246" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle" >Memoria dati</text>
<text x="668" y="266" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle" >variabili e risultati</text>
<text x="574" y="306" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle" >istruzione E dato nello stesso ciclo</text>
