<text x="740.0" y="387.31" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">GPR ≠ registri I/O</text>
<text x="740.0" y="403.56" font-size="11" text-anchor="middle" fill="#222">GPR: operandi dell'ALU</text>
<text x="740.0" y="419.81" font-size="11" text-anchor="middle" fill="#222">I/O (DDRB, PORTB, TCCR…):</text>
<text x="740.0" y="436.06" font-size="11" text-anchor="middle" fill="#222">ogni bit comanda l'hardware</text>
<text x="740.0" y="452.31" font-size="11" text-anchor="middle" fill="#222">SRAM: solo ld/st, 2 cicli</text>
<text x="60" y="530" font-size="13" text-anchor="start" fill="#222" font-weight="bold">SREG (registro di stato):</text>
<rect x="240" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="272" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">I</text>
<text x="272" y="560" font-size="10" text-anchor="middle" fill="#444">bit 7</text>
<rect x="310" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="342" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">T</text>
<text x="342" y="560" font-size="10" text-anchor="middle" fill="#444">bit 6</text>
<rect x="380" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="412" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">H</text>
<text x="412" y="560" font-size="10" text-anchor="middle" fill="#444">bit 5</text>
<rect x="450" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="482" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">S</text>
<text x="482" y="560" font-size="10" text-anchor="middle" fill="#444">bit 4</text>
<rect x="520" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="552" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">V</text>
<text x="552" y="560" font-size="10" text-anchor="middle" fill="#444">bit 3</text>
<rect x="590" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="622" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">N</text>
<text x="622" y="560" font-size="10" text-anchor="middle" fill="#444">bit 2</text>
<rect x="660" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="692" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Z</text>
<text x="692" y="560" font-size="10" text-anchor="middle" fill="#444">bit 1</text>
<rect x="730" y="510" width="65" height="34" fill="#ede9fe" stroke="#333"/><text x="762" y="532" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">C</text>
<text x="762" y="560" font-size="10" text-anchor="middle" fill="#444">bit 0</text>
<text x="450" y="585" font-size="11" text-anchor="middle" fill="#444">I=interrupt globali · T=utente · H=half carry · S=segno · V=overflow · N=negativo · Z=zero · C=carry</text>
