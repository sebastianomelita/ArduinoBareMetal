<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 325' width='900' height='325' font-family='Arial, Helvetica, sans-serif'>
<title>Funzionamento del watchdog timer</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='325' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Watchdog: se nessuno lo azzera, resetta il sistema</text><line x1='80' y1='260' x2='870' y2='260' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><line x1='80' y1='260' x2='80' y2='60' stroke='#333' stroke-width='1.5' marker-end='url(#a)'/><text x='864' y='278' font-size='12' text-anchor='end' font-weight='normal' fill='#718096'>tempo</text><text x='40' y='165.0' font-size='12' fill='#718096' text-anchor='middle' transform='rotate(-90 40 165.0)'>conteggio</text><line x1='80' y1='100' x2='860' y2='100' stroke='#c53030' stroke-width='1.5' stroke-dasharray='6 4'/><text x='860' y='94' font-size='12' text-anchor='end' font-weight='normal' fill='#c53030'>fine conteggio</text><polyline points='80.0,260.0 80.0,260.0 146.0,150.0 146.0,260.0 150.0,260.0 216.0,150.0 216.0,260.0 220.0,260.0 286.0,150.0 286.0,260.0 290.0,260.0 356.0,150.0 356.0,260.0 360.0,260.0 426.0,150.0 426.0,260.0 430.0,260.0 538.0,100.0 538.0,260.0 560.0,260.0 626.0,150.0 626.0,260.0 632.0,260.0 698.0,150.0 698.0,260.0 704.0,260.0 770.0,150.0 770.0,260.0 776.0,260.0 842.0,150.0 842.0,260.0' fill='none' stroke='#2b6cb0' stroke-width='2'/><line x1='430' y1='65' x2='430' y2='285' stroke='#718096' stroke-width='1' stroke-dasharray='4 4'/><line x1='560' y1='65' x2='560' y2='285' stroke='#718096' stroke-width='1' stroke-dasharray='4 4'/><circle cx='538' cy='100' r='6' fill='#c53030'/><text x='548' y='122' font-size='14' text-anchor='start' font-weight='bold' fill='#c53030'>RESET!</text><text x='255' y='135' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>ad ogni ciclo il loop azzera il contatore</text><text x='255' y='288' font-size='13' text-anchor='middle' font-weight='bold' fill='#1a202c'>funzionamento normale</text><text x='495' y='288' font-size='13' text-anchor='middle' font-weight='bold' fill='#c53030'>loop infinito</text><text x='495' y='305' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#c53030'>nessuno lo azzera</text><text x='710' y='288' font-size='13' text-anchor='middle' font-weight='bold' fill='#1a202c'>il sistema riparte</text>
</svg>