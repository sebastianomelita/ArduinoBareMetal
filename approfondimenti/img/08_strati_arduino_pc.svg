<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 395' width='900' height='395' font-family='Arial, Helvetica, sans-serif'>
<title>Strati di Arduino e del PC</title>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs>
<rect width='900' height='395' fill='white'/>
<text x='450' y='30' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a202c'>Arduino ha 2 strati, il PC 4 o più</text><text x='200' y='62' font-size='14.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>Scheda embedded (Arduino)</text><text x='200' y='80' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>monoprogrammata, senza SO</text><rect x='30' y='244' width='340' height='88' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='200.0' y='285.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Hardware: microcontrollore ATmega328P</text><text x='200.0' y='303.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>CPU AVR 8 bit + memorie + periferiche</text><rect x='30' y='210' width='340' height='26' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='200.0' y='227.0' text-anchor='middle' font-size='12' font-weight='normal' fill='#1a202c'>bootloader e librerie (unite allo sketch, non sono un SO)</text><rect x='30' y='114' width='340' height='88' rx='8' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='200.0' y='155.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Applicazione: lo sketch</text><text x='200.0' y='173.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>setup() + loop(), accede direttamente ai registri</text><text x='200' y='372' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>un solo programma, avvio immediato</text><text x='700' y='62' font-size='14.5' text-anchor='middle' font-weight='bold' fill='#1a202c'>Personal computer</text><text x='700' y='80' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#718096'>multiprogrammato</text><rect x='530' y='278' width='340' height='54' rx='8' fill='#eef4fb' stroke='#2b6cb0' stroke-width='1.5'/><text x='700.0' y='302.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Hardware</text><text x='700.0' y='320.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>CPU, RAM, dischi, scheda video, rete</text><rect x='530' y='216' width='340' height='54' rx='8' fill='#f7fafc' stroke='#718096' stroke-width='1.5'/><text x='700.0' y='240.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>BIOS / UEFI</text><text x='700.0' y='258.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>firmware: POST e avvio del SO</text><rect x='530' y='154' width='340' height='54' rx='8' fill='#f0fff4' stroke='#2f855a' stroke-width='1.5'/><text x='700.0' y='178.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Sistema operativo</text><text x='700.0' y='196.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>processi, memoria, file system, driver</text><rect x='530' y='92' width='340' height='54' rx='8' fill='#fffaf0' stroke='#c05621' stroke-width='1.5'/><text x='700.0' y='116.0' text-anchor='middle' font-size='14' font-weight='bold' fill='#1a202c'>Applicazione</text><text x='700.0' y='134.0' text-anchor='middle' font-size='11.5' fill='#4a5568'>chiede i servizi al SO (system call)</text><text x='700' y='372' font-size='12' text-anchor='middle' font-weight='normal' fill='#4a5568'>molti programmi, avvio in decine di secondi</text><line x1='450' y1='60' x2='450' y2='380' stroke='#e2e8f0' stroke-width='1'/>
</svg>